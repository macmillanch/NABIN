<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<!-- Applying JSON styling keys: style_bg_color, style_primary_color, style_brand_logo, style_component_shape, style_separation_logic, style_shell_layout, style_interactions -->
<header class="bg-surface border-b border-outline-variant w-full top-0 sticky flex items-center px-margin-mobile h-touch-target-min z-50 shadow-sm">
<div class="flex items-center gap-stack-md w-full">
<button aria-label="Go back" class="text-primary hover:bg-surface-container-high transition-colors cursor-pointer active:scale-95 transition-transform flex items-center justify-center w-touch-target-min h-touch-target-min rounded-full -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface flex-1">
                Notifications
            </h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg md:px-margin-desktop md:max-w-3xl md:mx-auto md:w-full w-full relative">

<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[200%] h-96 bg-primary-container/5 blur-[120px] rounded-full pointer-events-none -z-10"></div>
<!-- Settings Group: Trip & Job Alerts -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-md text-label-md text-primary uppercase tracking-widest pl-1">Trip &amp; Job Alerts</h2>
<div class="bg-surface-container-low rounded-xl ring-1 ring-white/10 px-margin-mobile flex flex-col shadow-lg shadow-black/20">
<!-- Toggle Item 1 -->
<label class="flex justify-between items-center py-stack-md min-h-[64px] border-b border-outline-variant last:border-0 cursor-pointer group">
<div class="flex flex-col gap-1 pr-stack-md">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary transition-colors">New Job Requests</span>
<span class="font-body-md text-body-md text-on-surface-variant">Push notifications and sound for incoming rides</span>
</div>
<div class="relative w-12 h-6 flex-shrink-0">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="absolute inset-0 rounded-full bg-surface-variant ring-1 ring-inset ring-white/10 transition-colors duration-300 peer-checked:bg-primary-container"></div>
<div class="absolute left-[2px] top-[2px] w-5 h-5 rounded-full bg-on-surface shadow-sm transition-transform duration-300 peer-checked:translate-x-6"></div>
</div>
</label>

<span class="font-body-md text-body-md text-on-surface-variant">Alerts for passenger cancellations or delays</span>
</div>
<div class="relative w-12 h-6 flex-shrink-0">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="absolute inset-0 rounded-full bg-surface-variant ring-1 ring-inset ring-white/10 transition-colors duration-300 peer-checked:bg-primary-container"></div>
<div class="absolute left-[2px] top-[2px] w-5 h-5 rounded-full bg-on-surface shadow-sm transition-transform duration-300 peer-checked:translate-x-6"></div>
</div>
</label>
</div>
</section>
