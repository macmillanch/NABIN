<style>

            color: #e1e2ed;

<body class="min-h-screen flex flex-col font-body-md">
<!-- Top Navigation (Transactional, no shell navs per logic) -->
<header class="w-full pt-margin-mobile px-margin-mobile pb-stack-lg flex items-center">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</header>
<main class="flex-grow px-margin-mobile pb-margin-desktop flex flex-col max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-stack-lg">
<p class="font-label-md text-label-md text-primary mb-2 tracking-wide uppercase">Step 1 of 4</p>
<h1 class="font-headline-xl text-headline-xl text-on-surface">Choose Your Vehicle</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Select the type of vehicle you will use for deliveries.</p>
</div>
<!-- Vehicle Selection List -->
<div class="flex flex-col gap-stack-md flex-grow">
<!-- Option 1: Bike -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="vehicle" type="radio" value="bike"/>
<div class="h-auto min-h-[88px] bg-surface-container-low rounded-xl p-4 flex items-center gap-4 glass-edge transition-all duration-200 peer-checked:bg-surface-container-high peer-checked:ring-2 peer-checked:ring-primary-container hover:bg-surface-container-highest">
<div class="h-12 w-12 rounded-full bg-[#111827] flex items-center justify-center text-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pedal_bike</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Bike</h3>
<p class="font-body-sm text-on-surface-variant text-sm">Perfect for dense city traffic and short routes.</p>
</div>
<div class="text-surface-container-highest peer-checked:text-primary-container shrink-0">
<span class="material-symbols-outlined text-[24px]">radio_button_checked</span>
</div>
</div>
</label>
<!-- Option 2: Auto -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="vehicle" type="radio" value="auto"/>
<div class="h-auto min-h-[88px] bg-surface-container-low rounded-xl p-4 flex items-center gap-4 glass-edge transition-all duration-200 peer-checked:bg-surface-container-high peer-checked:ring-2 peer-checked:ring-primary-container hover:bg-surface-container-highest">
<div class="h-12 w-12 rounded-full bg-[#111827] flex items-center justify-center text-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">two_wheeler</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Auto / Moped</h3>
<p class="font-body-sm text-on-surface-variant text-sm">Balance of speed and payload for urban areas.</p>
</div>
<div class="text-surface-container-highest peer-checked:text-primary-container shrink-0">
<span class="material-symbols-outlined text-[24px]">radio_button_checked</span>
</div>
</div>
</label>
<!-- Option 3: Car -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="vehicle" type="radio" value="car"/>
<div class="h-auto min-h-[88px] bg-surface-container-low rounded-xl p-4 flex items-center gap-4 glass-edge transition-all duration-200 peer-checked:bg-surface-container-high peer-checked:ring-2 peer-checked:ring-primary-container hover:bg-surface-container-highest">
<div class="h-12 w-12 rounded-full bg-[#111827] flex items-center justify-center text-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
<div class="flex-grow">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Car</h3>
<p class="font-body-sm text-on-surface-variant text-sm">Best for larger deliveries and longer distances.</p>
</div>
<div class="text-surface-container-highest peer-checked:text-primary-container shrink-0">
<span class="material-symbols-outlined text-[24px]">radio_button_checked</span>
</div>
</div>
</label>
</div>
<!-- Action Button -->
<div class="mt-stack-lg pt-stack-md">
<button class="w-full h-14 bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile rounded-lg glass-edge hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Continue Registration
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple script to handle visual states of the custom radio buttons
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // Reset all icons to unchecked
                document.querySelectorAll('.material-symbols-outlined.text-\\[24px\\]').forEach(icon => {
                    icon.textContent = 'radio_button_unchecked';
                });
                
                // Set the checked icon for the selected option
                if(this.checked) {
                    const iconContainer = this.nextElementSibling.querySelector('.material-symbols-outlined.text-\\[24px\\]');
                    if(iconContainer) {
                        iconContainer.textContent = 'radio_button_checked';
                    }
                }
            });
        });

        // Initialize state
        const firstRadio = document.querySelector('input[type="radio"]');
        if(firstRadio) {
            firstRadio.checked = true;
            firstRadio.dispatchEvent(new Event('change'));
        }
    </script>
