<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driving Licence Upload</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#ffede6",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed-variant": "#43474d",
                        "outline": "#8d90a0",
                        "surface-bright": "#373942",
                        "surface-variant": "#32343d",
                        "inverse-primary": "#0053db",
                        "primary-fixed-dim": "#b4c5ff",
                        "inverse-surface": "#e1e2ed",
                        "secondary-fixed-dim": "#c3c6ce",
                        "error-container": "#93000a",
                        "on-surface-variant": "#c3c6d7",
                        "tertiary": "#ffb596",
                        "surface": "#11131b",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-container": "#2563eb",
                        "secondary-fixed": "#e0e2ea",
                        "on-secondary": "#2d3136",
                        "on-primary-container": "#eeefff",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "on-background": "#e1e2ed",
                        "surface-container": "#1d1f27",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#434655",
                        "surface-tint": "#b4c5ff",
                        "tertiary-fixed": "#ffdbcd",
                        "on-tertiary-fixed": "#360f00",
                        "secondary": "#c3c6ce",
                        "surface-container-low": "#191b23",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "background": "#11131b",
                        "primary": "#b4c5ff",
                        "on-secondary-container": "#b2b5bc",
                        "on-tertiary": "#581e00",
                        "tertiary-container": "#bc4800",
                        "inverse-on-surface": "#2e3039",
                        "on-secondary-fixed": "#181c21",
                        "on-primary": "#002a78",
                        "surface-dim": "#11131b",
                        "surface-container-highest": "#32343d",
                        "on-surface": "#e1e2ed",
                        "secondary-container": "#43474d",
                        "surface-container-high": "#282a32",
                        "surface-container-lowest": "#0c0e16",
                        "on-primary-fixed": "#00174b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "touch-target-min": "48px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "base": "4px",
                        "stack-md": "16px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "data-tabular": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">
<!-- TopAppBar (Transactional - Hidden Navigation Shells based on intent) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant/10 flex items-center justify-between px-margin-mobile h-touch-target-min">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary dark:text-primary active:scale-95 transition-transform duration-150 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface dark:text-on-surface font-bold">Driving Licence</h1>
<button class="px-4 h-touch-target-min flex items-center justify-center text-primary dark:text-primary active:scale-95 transition-transform duration-150 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full font-label-md text-label-md">
            Help
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[56px] px-margin-mobile md:px-margin-desktop py-stack-lg max-w-2xl mx-auto w-full flex flex-col">
<!-- Progress Indicator -->
<div class="mb-stack-lg flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 4</span>
<span class="font-label-md text-label-md text-primary font-semibold">Verification</span>
</div>
<div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-2/4 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<!-- Header & Instructions -->
<div class="mb-stack-lg">
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-2">Upload your Licence</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Ensure all details are readable and the card is not cut off. Please upload a clear photo of both the front and back of your driving licence.
            </p>
</div>
<!-- Upload Areas -->
<div class="flex flex-col gap-stack-md flex-1">
<!-- Front Side Upload Card -->
<button class="relative w-full aspect-[1.586/1] bg-surface-container rounded-xl border border-outline-variant/30 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors group focus:outline-none focus:ring-2 focus:ring-primary-container overflow-hidden focus:border-primary-container">
<!-- Glass Edge Effect via pseudo-element if needed, handled by border here -->
<div class="absolute inset-0 ring-1 ring-white/10 rounded-xl pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="photo_camera">photo_camera</span>
</div>
<div class="flex flex-col items-center">
<span class="font-label-md text-label-md text-on-surface font-semibold">Front Side</span>
<span class="font-body-sm text-[12px] text-on-surface-variant mt-1">Upload Photo</span>
</div>
</button>
<!-- Back Side Upload Card -->
<button class="relative w-full aspect-[1.586/1] bg-surface-container rounded-xl border border-outline-variant/30 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors group focus:outline-none focus:ring-2 focus:ring-primary-container overflow-hidden focus:border-primary-container">
<div class="absolute inset-0 ring-1 ring-white/10 rounded-xl pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="photo_camera">photo_camera</span>
</div>
<div class="flex flex-col items-center">
<span class="font-label-md text-label-md text-on-surface font-semibold">Back Side</span>
<span class="font-body-sm text-[12px] text-on-surface-variant mt-1">Upload Photo</span>
</div>
</button>
</div>
</main>
<!-- Bottom Action Bar (Contextual to this transactional flow) -->
<div class="p-margin-mobile md:px-margin-desktop bg-surface border-t border-outline-variant/10 pb-safe pb-8">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full h-[56px] rounded-lg bg-surface-container-high text-on-surface-variant font-label-md text-label-md font-semibold flex items-center justify-center transition-all cursor-not-allowed opacity-70 border border-outline-variant/10" disabled="">
                Continue
            </button>
<!-- 
                Active State Example (Hidden):
                <button class="w-full h-[56px] rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold flex items-center justify-center active:scale-[0.98] transition-transform">Continue</button>
            -->
</div>
</div>
</body></html>
