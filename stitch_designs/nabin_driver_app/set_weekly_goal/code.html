<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set Your Weekly Goal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#32343d",
                    "inverse-on-surface": "#2e3039",
                    "tertiary-fixed": "#ffdbcd",
                    "surface-tint": "#b4c5ff",
                    "on-error-container": "#ffdad6",
                    "surface-container-low": "#191b23",
                    "tertiary-fixed-dim": "#ffb596",
                    "secondary-fixed-dim": "#c3c6ce",
                    "inverse-primary": "#0053db",
                    "on-tertiary-container": "#ffede6",
                    "inverse-surface": "#e1e2ed",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "surface-container-highest": "#32343d",
                    "on-primary": "#002a78",
                    "secondary-fixed": "#e0e2ea",
                    "surface-bright": "#373942",
                    "tertiary": "#ffb596",
                    "surface-container": "#1d1f27",
                    "tertiary-container": "#bc4800",
                    "surface-container-lowest": "#0c0e16",
                    "surface-container-high": "#282a32",
                    "outline-variant": "#434655",
                    "on-tertiary": "#581e00",
                    "primary-container": "#2563eb",
                    "on-secondary": "#2d3136",
                    "error-container": "#93000a",
                    "on-tertiary-fixed": "#360f00",
                    "on-background": "#e1e2ed",
                    "on-primary-fixed": "#00174b",
                    "surface-dim": "#11131b",
                    "on-primary-container": "#eeefff",
                    "on-primary-fixed-variant": "#003ea8",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-error": "#690005",
                    "on-secondary-fixed": "#181c21",
                    "primary-fixed": "#dbe1ff",
                    "secondary-container": "#43474d",
                    "on-surface": "#e1e2ed",
                    "background": "#11131b",
                    "on-secondary-container": "#b2b5bc",
                    "error": "#ffb4ab",
                    "surface": "#11131b",
                    "on-secondary-fixed-variant": "#43474d",
                    "outline": "#8d90a0",
                    "on-surface-variant": "#c3c6d7",
                    "primary": "#b4c5ff",
                    "secondary": "#c3c6ce"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "touch-target-min": "48px",
                    "gutter": "16px",
                    "margin-mobile": "16px",
                    "stack-lg": "24px",
                    "stack-sm": "8px",
                    "base": "4px",
                    "margin-desktop": "32px"
            },
            "fontFamily": {
                    "headline-xl": ["Inter"],
                    "data-tabular": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "data-tabular": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface bg-surface-container-high dark:bg-surface-container-high flex items-center justify-between px-margin-mobile h-touch-target-min w-full">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary">Set Goal</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[calc(var(--spacing-touch-target-min)+var(--spacing-margin-mobile))] pb-[calc(var(--spacing-touch-target-min)+var(--spacing-margin-mobile))] px-margin-mobile md:px-margin-desktop flex flex-col gap-stack-lg max-w-2xl mx-auto w-full">
<!-- Header Section -->
<section class="flex flex-col gap-stack-sm text-center md:text-left pt-stack-md">
<h2 class="font-headline-xl text-headline-xl text-on-surface">Set Your Weekly Goal</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Choose a target to stay motivated and track your progress.</p>
</section>
<!-- Presets Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-stack-md">
<!-- Preset Card 1 -->
<button class="relative bg-surface-container dark:bg-surface-container border border-surface-variant dark:border-surface-variant rounded-xl p-stack-md flex flex-col items-center md:items-start gap-stack-sm hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors group focus:outline-none focus:ring-2 focus:ring-primary-container">
<div class="absolute inset-0 rounded-xl border border-white opacity-10 pointer-events-none"></div>
<span class="font-data-tabular text-data-tabular text-on-surface text-2xl">₹5,000</span>
<span class="font-label-md text-label-md text-on-surface-variant">Steady Pace</span>
</button>
<!-- Preset Card 2 (Recommended/Active) -->
<button class="relative bg-surface-container-high dark:bg-surface-container-high border-2 border-primary-container rounded-xl p-stack-md flex flex-col items-center md:items-start gap-stack-sm hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors group focus:outline-none">
<div class="absolute inset-0 rounded-xl border border-white opacity-10 pointer-events-none"></div>
<!-- Recommended Badge -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 md:left-4 md:-translate-x-0 bg-[#0B1527] border border-primary text-primary px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase shadow-sm">
                    Recommended
                </div>
<span class="font-data-tabular text-data-tabular text-on-surface text-2xl mt-2">₹10,000</span>
<span class="font-label-md text-label-md text-on-surface-variant">Ambitious</span>
</button>
<!-- Preset Card 3 -->
<button class="relative bg-surface-container dark:bg-surface-container border border-surface-variant dark:border-surface-variant rounded-xl p-stack-md flex flex-col items-center md:items-start gap-stack-sm hover:bg-surface-variant dark:hover:bg-surface-variant transition-colors group focus:outline-none focus:ring-2 focus:ring-primary-container">
<div class="absolute inset-0 rounded-xl border border-white opacity-10 pointer-events-none"></div>
<span class="font-data-tabular text-data-tabular text-on-surface text-2xl">₹15,000</span>
<span class="font-label-md text-label-md text-on-surface-variant">High Earner</span>
</button>
</section>
<!-- Divider -->
<div class="flex items-center gap-4 my-stack-sm">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">OR</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Custom Input -->
<section class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="custom-goal">Custom Goal</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-data-tabular text-data-tabular text-on-surface-variant text-xl">₹</span>
<input class="w-full bg-[#111827] border border-[#1E293B] focus:border-primary-container focus:ring-1 focus:ring-primary-container rounded-xl h-14 pl-10 pr-4 font-data-tabular text-data-tabular text-on-surface text-xl placeholder:text-outline-variant transition-colors" id="custom-goal" placeholder="Enter amount" type="number"/>
</div>
<p class="font-label-md text-label-md text-on-surface-variant text-sm mt-1">Minimum target is ₹1,000.</p>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface-container-high border-t border-surface-variant p-margin-mobile md:px-margin-desktop shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.5)] z-40 max-w-2xl mx-auto left-0 right-0">
<button class="w-full h-14 bg-primary-container hover:bg-[#1d4ed8] text-white font-headline-lg-mobile text-headline-lg-mobile rounded-xl transition-colors flex items-center justify-center gap-2 relative overflow-hidden group focus:outline-none focus:ring-4 focus:ring-primary-container/30 active:scale-[0.98]">
<div class="absolute inset-0 rounded-xl border border-white opacity-20 pointer-events-none"></div>
<span>Set Goal</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</body></html>
