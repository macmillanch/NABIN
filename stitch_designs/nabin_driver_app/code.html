<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NABIN Driver • Unified Partner Console</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF4FF',
              100: '#D9E6FF',
              500: '#1D4ED8',
              600: '#003D9B',
              700: '#0C56D0',
              800: '#002B70',
              900: '#001848'
            },
            accent: {
              green: '#00C853',
              amber: '#FF9100',
              red: '#E53935'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .leaflet-container { width: 100%; height: 100%; z-index: 1; }
    .leaflet-control-attribution { display: none !important; }
    @keyframes radarPulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.6); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 200, 83, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
    }
    .radar-pulse { animation: radarPulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1); }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100 flex flex-col items-center justify-center">
  <iframe src="../../driver_app.html" class="w-full h-full border-none"></iframe>
</body>
</html>
