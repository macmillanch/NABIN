<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .glass-edge {
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .success-glow {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.2);
        }

        @keyframes scaleIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .animate-scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-slide-up-1 {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .animate-slide-up-2 {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }
        
        .animate-slide-up-3 {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- Canvas area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-12">
<!-- Animated Success Graphic -->
<div class="mb-stack-lg relative animate-scale-in">
<div class="absolute inset-0 bg-success/20 rounded-full blur-2xl"></div>
<div class="w-24 h-24 rounded-full bg-success-container/20 glass-edge flex items-center justify-center relative z-10 success-glow">
<span class="material-symbols-outlined text-[48px] text-success" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
</div>
<!-- Typography Header -->
<div class="text-center mb-stack-lg w-full max-w-md animate-slide-up-1">
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-stack-sm">Transfer Successful!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
<span class="text-on-surface font-semibold">$380.00</span> is on its way to your bank account.
            </p>
</div>
<!-- Detailed Breakdown Card -->
<div class="w-full max-w-md bg-[#17202B] rounded-xl p-stack-md glass-edge mb-stack-lg animate-slide-up-2">
<div class="flex justify-between items-center py-stack-sm border-b border-outline-variant/30">
<span class="font-body-md text-body-md text-on-surface-variant">Transaction ID</span>
<span class="font-data-tabular text-data-tabular text-on-surface">#NB-PY-92810</span>
</div>
<div class="flex justify-between items-center py-stack-sm border-b border-outline-variant/30">
<span class="font-body-md text-body-md text-on-surface-variant">Destination</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-data-tabular text-data-tabular text-on-surface">Chase Bank (...4829)</span>
</div>
</div>
<div class="flex justify-between items-center pt-stack-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Date</span>
<span class="font-data-tabular text-data-tabular text-on-surface">Oct 24, 2023, 10:45 AM</span>
</div>
</div>
<!-- Secondary Info -->
<div class="w-full max-w-md text-center animate-slide-up-3">
<div class="inline-flex items-center gap-2 bg-[#17202B]/50 rounded-lg px-4 py-3 glass-edge">
<span class="material-symbols-outlined text-[20px] text-primary">notifications_active</span>
<p class="font-label-md text-label-md text-on-surface-variant">
                    You'll receive a notification once the funds are available.
                </p>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="px-margin-mobile md:px-margin-desktop pb-margin-mobile md:pb-margin-desktop w-full max-w-md mx-auto animate-slide-up-3">
<button class="w-full h-touch-target-min bg-primary-container text-on-primary-container rounded-lg font-headline-lg-mobile text-headline-lg-mobile glass-edge flex items-center justify-center gap-2 active:scale-95 transition-transform duration-100 hover:bg-primary-container/90">
<span class="material-symbols-outlined">account_balance_wallet</span>
            Back to Wallet
        </button>
</div>
