<body class="bg-background text-on-background h-screen overflow-hidden flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min w-full top-0 bg-surface-dim/90 backdrop-blur-md bg-surface-dim dark:bg-surface-dim">

</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-headline-lg-mobile font-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">Partner Stations</h1>
<button aria-label="Search" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>

<!-- Mock Map Image representing a dark mode map view -->

<div class="bg-surface-container-high rounded-xl p-stack-sm flex items-center shadow-lg border border-outline-variant/30 backdrop-blur-md">
<button class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-lg">

</button>
<div class="flex-grow flex gap-stack-sm overflow-x-auto hide-scrollbar px-stack-sm">

<span class="material-symbols-outlined text-[18px]">local_gas_station</span> Fuel
                     </button>
<button class="px-stack-md py-stack-sm rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant/30 font-label-md text-label-md whitespace-nowrap flex items-center gap-base transition-colors hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">build</span> Service
                     </button>
<button class="px-stack-md py-stack-sm rounded-full bg-surface-variant text-on-surface-variant border border-outline-variant/30 font-label-md text-label-md whitespace-nowrap flex items-center gap-base transition-colors hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">restaurant</span> Food
                     </button>
</div>
</div>

<span class="material-symbols-outlined text-primary" data-icon="local_gas_station" style="font-variation-settings: 'FILL' 1;">local_gas_station</span>

</div>
</div>

</button>

            scrollbar-width: none;
