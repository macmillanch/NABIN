<style>
        body { font-family: 'Inter', sans-serif; }

<body class="bg-background text-on-background min-h-screen pb-touch-target-min antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background border-b border-surface-variant/10 flex items-center justify-between px-margin-mobile h-touch-target-min z-50">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center hover:bg-surface-variant/20 transition-colors scale-95 duration-100 rounded-full text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-background">Trip Summary</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<main class="px-margin-mobile pt-stack-lg pb-32 max-w-md mx-auto space-y-stack-lg">
<!-- Success Header -->
<section class="flex flex-col items-center text-center space-y-stack-sm">
<div class="w-20 h-20 rounded-full bg-primary-container/20 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-background">Trip Completed!</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Great job on finishing your ride safely.</p>
</section>
<!-- Earnings Section -->
<section class="bg-surface-container rounded-xl p-gutter border border-surface-variant/50 shadow-sm relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
<div class="flex flex-col items-center mb-stack-md relative z-10">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Total Earnings</span>
<div class="font-headline-xl text-headline-xl text-primary font-bold">₹142.50</div>
</div>
<div class="space-y-stack-sm relative z-10 border-t border-surface-variant/30 pt-stack-md">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Base Fare</span>
<span class="font-data-tabular text-data-tabular text-on-background">₹95.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Tips</span>
<span class="font-data-tabular text-data-tabular text-primary">₹25.00</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Surge/Bonus</span>
<span class="font-data-tabular text-data-tabular text-on-background">₹22.50</span>
</div>
</div>
</section>
<!-- Trip Stats Card (Bento-style) -->
<section class="grid grid-cols-3 gap-base">
<div class="bg-surface-container rounded-lg p-stack-sm flex flex-col items-center justify-center text-center h-24 border border-surface-variant/30">
<span class="material-symbols-outlined text-on-surface-variant mb-1" data-icon="route">route</span>
<span class="font-data-tabular text-data-tabular text-on-background">4.2</span>
<span class="font-label-md text-label-md text-on-surface-variant text-xs">km</span>
</div>
<div class="bg-surface-container rounded-lg p-stack-sm flex flex-col items-center justify-center text-center h-24 border border-surface-variant/30">
<span class="material-symbols-outlined text-on-surface-variant mb-1" data-icon="schedule">schedule</span>
<span class="font-data-tabular text-data-tabular text-on-background">18</span>
<span class="font-label-md text-label-md text-on-surface-variant text-xs">mins</span>
</div>
<div class="bg-primary/10 rounded-lg p-stack-sm flex flex-col items-center justify-center text-center h-24 border border-primary/20">
<span class="material-symbols-outlined text-primary mb-1" data-icon="stars">stars</span>
<span class="font-data-tabular text-data-tabular text-primary">15</span>
<span class="font-label-md text-label-md text-primary text-xs">pts</span>
</div>
</section>
<!-- Rider Rating -->
<section class="bg-surface-container rounded-xl p-gutter border border-surface-variant/50">
<div class="flex items-center gap-stack-md mb-stack-md">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A close up portrait of a young professional man in a modern city setting, dark mode aesthetic, soft blue neon lighting accents, realistic rendering." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXhQuWSC271UNClsZqzvu2OIe0XkdPBiBASNJ73iJWG9uFBj3we2BryGhFyd3hFkoPFxyhfRDNY7Mmjx-QAuqwp1oj_Mv0PBFjVqyDMYiYAaPHPZxwT10scvVPJbuabvH9veXoXty3Ypd3CBgNwwvlbnJEgbwYiOgAvaSpISQXRtax_p-MLVdIfQIatssE8GwDsClO4NUBwisrlis_FKXALxU_ny_KowgAJhEWTU_HkJ2a9o5oUm0">
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-background font-medium">Arjun K.</h3>
<p class="font-label-md text-label-md text-on-surface-variant">Rider</p>
</div>
</div>
<div class="flex justify-center gap-2 mb-stack-md py-2">
<!-- Interactive Stars Placeholder -->
<button class="text-secondary hover:text-primary transition-colors"><span class="material-symbols-outlined text-[32px]" data-icon="star">star</span></button>
<button class="text-secondary hover:text-primary transition-colors"><span class="material-symbols-outlined text-[32px]" data-icon="star">star</span></button>
<button class="text-secondary hover:text-primary transition-colors"><span class="material-symbols-outlined text-[32px]" data-icon="star">star</span></button>
<button class="text-secondary hover:text-primary transition-colors"><span class="material-symbols-outlined text-[32px]" data-icon="star">star</span></button>
<button class="text-secondary hover:text-primary transition-colors"><span class="material-symbols-outlined text-[32px]" data-icon="star">star</span></button>
</div>
<div class="flex flex-wrap gap-2 justify-center">
<button class="px-6 py-3 rounded-full border border-primary/20 bg-primary/10 text-primary font-label-md text-label-md font-bold hover:bg-primary/20 transition-all active:scale-95">Polite</button>
<button class="px-6 py-3 rounded-full border border-primary/20 bg-primary/10 text-primary font-label-md text-label-md font-bold hover:bg-primary/20 transition-all active:scale-95">On Time</button>
<button class="px-6 py-3 rounded-full border border-primary/20 bg-primary/10 text-primary font-label-md text-label-md font-bold hover:bg-primary/20 transition-all active:scale-95">Safe Pickup</button>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container/90 backdrop-blur-md border-t border-surface-variant/20 p-margin-mobile pb-[calc(16px+env(safe-area-inset-bottom))] z-50 flex justify-center">
<button class="w-full max-w-md h-touch-target-min bg-primary text-on-primary rounded-xl font-label-md text-label-md font-bold hover:bg-primary/90 active:scale-95 transition-all shadow-lg flex items-center justify-center gap-stack-sm">
            Back to Online
            <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>


</body></html>
