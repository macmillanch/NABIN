<body class="bg-background text-on-background min-h-screen font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface-dim dark:bg-surface-dim bg-surface-container-low border-b border-outline-variant flex items-center justify-between px-margin-mobile h-touch-target-min">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-variant/50 active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Help Center</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-variant/50 active:scale-95 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</header>
<!-- Main Content Canvas (Navigation suppressed for transactional screen) -->
<main class="pt-[80px] pb-stack-lg px-margin-mobile md:px-margin-desktop max-w-2xl mx-auto">
<div class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Raise a Ticket</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide details about your issue below. Our support team will get back to you as soon as possible.</p>
</div>
<form class="space-y-stack-md">
<!-- Issue Category -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="category">Issue Category</label>
<div class="relative">
<select class="w-full bg-[#111827] border border-[#1E293B] rounded-lg h-touch-target-min px-4 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-inner shadow-white/10" id="category" name="category">
<option disabled="" selected="" value="">Select an issue...</option>
<option value="payment">Payment missing</option>
<option value="app_crash">App crash</option>
<option value="rider_behavior">Rider behavior</option>
<option value="vehicle_issue">Vehicle issue</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="description">Describe your issue</label>
<textarea class="w-full bg-[#111827] border border-[#1E293B] rounded-lg p-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-inner shadow-white/10 resize-y" id="description" name="description" placeholder="Please provide as much detail as possible..." rows="5"></textarea>
</div>
<!-- Attachment -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Attach Screenshot (Optional)</label>
<div class="border-2 border-dashed border-[#1E293B] rounded-lg bg-[#111827] hover:bg-surface-variant/30 transition-colors p-stack-md flex flex-col items-center justify-center cursor-pointer shadow-inner shadow-white/10 group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors text-[32px] mb-2">cloud_upload</span>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors">Tap to upload or drag and drop</span>
<span class="font-label-md text-label-md text-outline mt-1">PNG, JPG, up to 10MB</span>
<input accept="image/png, image/jpeg" class="hidden" type="file"/>
</div>
</div>
<!-- Submit Action -->
<div class="pt-stack-md">
<button class="w-full bg-primary-container text-white h-[56px] rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary-container/90 active:scale-[0.98] transition-all shadow-inner shadow-white/20 shadow-[0_4px_14px_0_rgba(37,99,235,0.39)]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                    Submit Ticket
                </button>
<p class="text-center font-label-md text-label-md text-on-surface-variant mt-stack-sm flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                    We usually reply within 2 hours
                </p>
</div>
</form>
</main>
</body></html>
