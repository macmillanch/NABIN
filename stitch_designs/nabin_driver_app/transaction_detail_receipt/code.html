<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transaction Detail Receipt</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#e1e2ed",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-primary": "#002a78",
                        "on-surface-variant": "#c3c6d7",
                        "surface-tint": "#b4c5ff",
                        "primary-container": "#2563eb",
                        "tertiary-fixed-dim": "#ffb596",
                        "inverse-surface": "#e1e2ed",
                        "on-primary-fixed": "#00174b",
                        "surface-container": "#1d1f27",
                        "on-secondary-fixed-variant": "#43474d",
                        "surface-container-low": "#191b23",
                        "outline": "#8d90a0",
                        "inverse-on-surface": "#2e3039",
                        "on-primary-container": "#eeefff",
                        "on-tertiary": "#581e00",
                        "tertiary": "#ffb596",
                        "on-secondary-container": "#b2b5bc",
                        "secondary": "#c3c6ce",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container-lowest": "#0c0e16",
                        "inverse-primary": "#0053db",
                        "primary": "#b4c5ff",
                        "surface-variant": "#32343d",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#ffede6",
                        "secondary-fixed-dim": "#c3c6ce",
                        "on-surface": "#e1e2ed",
                        "background": "#11131b",
                        "surface-bright": "#373942",
                        "surface-container-highest": "#32343d",
                        "secondary-container": "#43474d",
                        "surface-dim": "#11131b",
                        "surface-container-high": "#282a32",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#dbe1ff",
                        "tertiary-container": "#bc4800",
                        "on-secondary": "#2d3136",
                        "secondary-fixed": "#e0e2ea",
                        "surface": "#11131b",
                        "outline-variant": "#434655",
                        "primary-fixed-dim": "#b4c5ff",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#181c21"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "stack-md": "16px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "base": "4px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "data-tabular": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "data-tabular": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky flex items-center justify-between px-margin-mobile h-touch-target-min z-50">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min text-primary dark:text-primary active:scale-95 transition-transform duration-150 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface dark:text-on-surface">Receipt</h1>
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min text-primary dark:text-primary active:scale-95 transition-transform duration-150 hover:bg-surface-container-highest dark:hover:bg-surface-container-highest rounded-full">
<span class="material-symbols-outlined">share</span>
</button>
</header>
<main class="flex-1 flex flex-col px-margin-mobile md:px-margin-desktop pt-stack-lg pb-margin-desktop max-w-3xl mx-auto w-full">
<!-- Hero Section -->
<section class="flex flex-col items-center justify-center py-stack-lg mb-stack-md">
<h2 class="font-headline-xl text-headline-xl text-on-surface mb-stack-sm tracking-tight">₹1,250.00</h2>
<div class="inline-flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-on-surface">Payout Successful</span>
</div>
</section>
<!-- Receipt Card (Bento Style) -->
<section class="bg-surface-container rounded-xl p-gutter border border-white/10 shadow-lg relative overflow-hidden mb-stack-lg">
<!-- Subtle atmospheric glow -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="flex flex-col gap-stack-md relative z-10">
<!-- Row 1: Transaction ID -->
<div class="flex justify-between items-center py-stack-sm border-b border-surface-variant">
<span class="font-label-md text-label-md text-on-surface-variant">Transaction ID</span>
<span class="font-data-tabular text-data-tabular text-on-surface">NB-TRX-982145</span>
</div>
<!-- Row 2: Date & Time -->
<div class="flex justify-between items-center py-stack-sm border-b border-surface-variant">
<span class="font-label-md text-label-md text-on-surface-variant">Date &amp; Time</span>
<span class="font-body-md text-body-md text-on-surface text-right">Oct 24, 2023<br/><span class="text-on-surface-variant">10:30 AM</span></span>
</div>
<!-- Row 3: Payout Method -->
<div class="flex justify-between items-center py-stack-sm border-b border-surface-variant">
<span class="font-label-md text-label-md text-on-surface-variant">Payout Method</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
<span class="font-body-md text-body-md text-on-surface">HDFC Bank ....1234</span>
</div>
</div>
<!-- Row 4: Status -->
<div class="flex justify-between items-center py-stack-sm border-b border-surface-variant">
<span class="font-label-md text-label-md text-on-surface-variant">Status</span>
<span class="font-label-md text-label-md text-primary">Completed</span>
</div>
<!-- Row 5: Total Amount -->
<div class="flex justify-between items-center pt-stack-sm">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Total Amount</span>
<span class="font-data-tabular text-data-tabular text-on-surface text-lg">₹1,250.00</span>
</div>
</div>
</section>
<!-- Footer Actions -->
<footer class="mt-auto flex flex-col gap-stack-md pt-stack-md border-t border-surface-variant/50">
<button class="w-full h-touch-target-min bg-primary-container text-on-primary-container rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 active:scale-95 transition-transform border border-white/10 shadow-sm">
<span class="material-symbols-outlined text-[20px]">download</span>
                Download PDF Receipt
            </button>
<button class="w-full h-touch-target-min bg-surface-variant text-on-surface rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 active:scale-95 transition-transform border border-outline-variant/30">
<span class="material-symbols-outlined text-[20px]">help</span>
                Need Help with this Payout?
            </button>
</footer>
</main>
</body></html>
