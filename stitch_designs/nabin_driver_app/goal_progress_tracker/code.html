<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Goal Progress Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#32343d",
                        "inverse-on-surface": "#2e3039",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-tint": "#b4c5ff",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#191b23",
                        "tertiary-fixed-dim": "#ffb596",
                        "secondary-fixed-dim": "#c3c6ce",
                        "inverse-primary": "#0053db",
                        "on-tertiary-container": "#ffede6",
                        "inverse-surface": "#e1e2ed",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "surface-container-highest": "#32343d",
                        "on-primary": "#002a78",
                        "secondary-fixed": "#e0e2ea",
                        "surface-bright": "#373942",
                        "tertiary": "#ffb596",
                        "surface-container": "#1d1f27",
                        "tertiary-container": "#bc4800",
                        "surface-container-lowest": "#0c0e16",
                        "surface-container-high": "#282a32",
                        "outline-variant": "#434655",
                        "on-tertiary": "#581e00",
                        "primary-container": "#2563eb",
                        "on-secondary": "#2d3136",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#360f00",
                        "on-background": "#e1e2ed",
                        "on-primary-fixed": "#00174b",
                        "surface-dim": "#11131b",
                        "on-primary-container": "#eeefff",
                        "on-primary-fixed-variant": "#003ea8",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#181c21",
                        "primary-fixed": "#dbe1ff",
                        "secondary-container": "#43474d",
                        "on-surface": "#e1e2ed",
                        "background": "#11131b",
                        "on-secondary-container": "#b2b5bc",
                        "error": "#ffb4ab",
                        "surface": "#11131b",
                        "on-secondary-fixed-variant": "#43474d",
                        "outline": "#8d90a0",
                        "on-surface-variant": "#c3c6d7",
                        "primary": "#b4c5ff",
                        "secondary": "#c3c6ce"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "base": "4px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Inter"],
                        "data-tabular": ["Inter"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "data-tabular": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Circular Progress Animation */
        @keyframes dash {
            to {
                stroke-dashoffset: 84.82; /* ~30% remaining of circumference */
            }
        }
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            stroke-dasharray: 282.74; /* 2 * pi * r (45) */
            stroke-dashoffset: 282.74;
            animation: dash 1.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- TopAppBar (From JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b-0 shadow-none flex items-center justify-between px-margin-mobile h-touch-target-min transition-colors duration-200">
<button aria-label="Menu" class="h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-variant dark:hover:bg-surface-variant rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary tracking-tight">Driver Earnings</h1>
<button aria-label="Profile" class="h-touch-target-min w-touch-target-min flex items-center justify-center rounded-full overflow-hidden">
<img alt="driver profile photo" class="w-8 h-8 object-cover rounded-full" data-alt="A close up portrait of a professional driver with a confident expression, lit by the warm glow of dashboard lights against a deep dark background, emphasizing a high tech modern cockpit environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCanXPPnfl-7ZgnJXDqtZAsp7YCnaH3tvWXMOLe_NY0VcQy49d0x_nvJCOBhLjE2hW1FbDtC2L-yl6XCAIFvKKtKr9GDcYSctdTy7Ene3Xekb3CocpwwqMu0Bhirkwnt7Tga8B8kGMDr88d4399e6w51B9YSsBivIjirTE_GdilwAkn2q_w36LjONquJPZVp2-wxDyJ6MPach-WrOmfKQ3Wmd395YW5JRu50YxeeqNh5dFwDdm4CXk"/>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-lg mx-auto pt-[calc(var(--spacing-touch-target-min)+var(--spacing-stack-md))] pb-[calc(64px+var(--spacing-stack-lg))] px-margin-mobile flex flex-col gap-stack-lg">
<!-- Header -->
<div class="flex flex-col items-center text-center mt-stack-sm">
<h2 class="font-headline-xl text-headline-xl text-on-surface">Weekly Goal</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Oct 16 - Oct 22</p>
</div>
<!-- Hero Progress Ring -->
<div class="relative w-64 h-64 mx-auto flex items-center justify-center">
<!-- SVG Ring -->
<svg class="w-full h-full absolute inset-0" viewbox="0 0 100 100">
<!-- Track -->
<circle class="text-surface-variant" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="8"></circle>
<!-- Progress -->
<circle class="text-primary-container progress-ring__circle" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Central Data -->
<div class="absolute flex flex-col items-center justify-center text-center z-10 bg-surface/80 backdrop-blur-sm rounded-full w-48 h-48 border border-white/5 shadow-[inset_0_0_20px_rgba(37,99,235,0.15)]">
<span class="font-data-tabular text-data-tabular text-primary">70%</span>
<span class="font-headline-xl text-headline-xl text-on-surface mt-1 tracking-tight">₹8,450</span>
<div class="w-8 h-[1px] bg-outline-variant my-2"></div>
<span class="font-label-md text-label-md text-on-surface-variant">of ₹12,000</span>
</div>
<!-- Sparkles/Accents for premium feel -->
<div class="absolute -top-2 right-8 text-primary-container animate-pulse">
<span class="material-symbols-outlined text-[16px]" data-icon="stars" data-weight="fill">stars</span>
</div>
</div>
<!-- Stats Bento Grid -->
<div class="grid grid-cols-2 gap-gutter">
<!-- Remaining Card -->
<div class="bg-[#17202B] border border-white/10 rounded-xl p-stack-md flex flex-col gap-2 relative overflow-hidden">
<div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-error/20 to-transparent rounded-bl-full opacity-50"></div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="flag">flag</span>
<span class="font-label-md text-label-md">Remaining</span>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold">₹3,550</div>
<div class="font-body-md text-body-md text-on-surface-variant text-sm">to reach goal</div>
</div>
<!-- Daily Target Card -->
<div class="bg-[#17202B] border border-white/10 rounded-xl p-stack-md flex flex-col gap-2 relative overflow-hidden">
<div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-primary/20 to-transparent rounded-bl-full opacity-50"></div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-xl" data-icon="track_changes">track_changes</span>
<span class="font-label-md text-label-md">Daily Target</span>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold">₹887</div>
<div class="font-body-md text-body-md text-on-surface-variant text-sm">per day left (4)</div>
</div>
</div>
<!-- Action Area -->
<div class="mt-stack-md">
<button class="w-full h-[56px] bg-[#1E293B] border border-white/10 hover:border-primary transition-colors text-on-surface font-label-md text-label-md rounded-xl flex items-center justify-center gap-2 shadow-sm">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
                Update Goal
            </button>
</div>
</main>
<!-- BottomNavBar (From JSON) - 'Goals' Active -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container dark:bg-surface-container rounded-t-xl border-t-0 shadow-none flex justify-around items-center h-16 px-margin-mobile pb-2">
<!-- Dashboard (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 w-16 h-full pt-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="speed">speed</span>
<span class="font-label-md text-[10px] leading-tight font-medium">Dashboard</span>
</a>
<!-- Goals (Active - Based on Intent) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-all scale-95 active:scale-90 -mt-2 shadow-lg shadow-primary-container/20 border border-white/10" href="#">
<span class="material-symbols-outlined mb-1" data-icon="ads_click" data-weight="fill">ads_click</span>
<span class="font-label-md text-[10px] leading-tight font-medium">Goals</span>
</a>
<!-- Earnings (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 w-16 h-full pt-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="font-label-md text-[10px] leading-tight font-medium">Earnings</span>
</a>
<!-- Account (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all scale-95 active:scale-90 w-16 h-full pt-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-[10px] leading-tight font-medium">Account</span>
</a>
</nav>
</body></html>
