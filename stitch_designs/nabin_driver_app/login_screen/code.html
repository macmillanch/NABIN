<style>
        /* Base styles */
        body {
            background-color: #0B0F14; /* Level 0 Global Background per Style Guidance */
            color: #e1e2ed; /* on-background */
        }
        
        /* Glass Edge Effect */
        .glass-edge {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Gradient background for visual interest */
        .bg-gradient-radial {
            background-image: radial-gradient(circle at top right, rgba(37, 99, 235, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.1), transparent 40%);
        }
    </style>

<body class="min-h-screen flex flex-col antialiased bg-gradient-radial">
<!-- Main Content Area - Linear/Transactional so no Nav Shell -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-stack-lg max-w-md mx-auto w-full z-10 relative">
<!-- Header Section -->
<div class="mb-stack-lg text-center flex flex-col items-center">
<!-- Brand Icon -->
<div class="w-16 h-16 bg-surface-container-highest rounded-2xl flex items-center justify-center mb-stack-md glass-edge shadow-lg">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">local_taxi</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-stack-sm">NABIN Driver</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your phone number to continue</p>
</div>
<!-- Login Card (Level 1) -->
<div class="bg-[#111827] rounded-xl p-[16px] glass-edge w-full">
<form action="#" class="space-y-stack-md" method="POST">
<!-- Phone Number Input Group -->
<div>
<label class="sr-only" for="phone">Phone Number</label>
<div class="relative flex items-center">
<!-- Country Code (Fixed for this example, could be a dropdown) -->
<div class="absolute left-0 inset-y-0 flex items-center pl-4 pointer-events-none">
<span class="font-body-md text-body-md text-on-surface-variant">+1</span>
</div>
<input class="block w-full h-[56px] pl-12 pr-4 bg-[#111827] border border-[#1E293B] rounded-lg text-on-surface font-body-lg text-body-lg placeholder:text-outline-variant focus:ring-0 focus:border-primary-container transition-colors duration-200" id="phone" name="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[56px] bg-primary-container text-[#ffffff] font-label-md text-label-md rounded-lg flex items-center justify-center glass-edge hover:bg-inverse-primary transition-colors duration-200 active:scale-95 shadow-md" type="submit">
                    Continue
                    <span class="material-symbols-outlined ml-2 text-xl">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-md">
<div class="flex-grow border-t border-[#1E293B]"></div>
<span class="mx-4 font-label-md text-label-md text-on-surface-variant">OR</span>
<div class="flex-grow border-t border-[#1E293B]"></div>
</div>
<!-- Secondary Actions -->
<div class="space-y-stack-sm">
<button class="w-full h-[48px] bg-[#1E293B] text-on-surface font-label-md text-label-md rounded-lg flex items-center justify-center glass-edge hover:bg-surface-variant transition-colors duration-200" type="button">
<span class="material-symbols-outlined mr-2">mail</span>
                     Continue with Email
                 </button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg text-center space-y-stack-sm">
<a class="inline-block font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#">
                New to NABIN? Register
            </a>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-4">
                By continuing, you agree to our <a class="underline hover:text-on-surface" href="#">Terms</a> and <a class="underline hover:text-on-surface" href="#">Privacy Policy</a>.
            </p>
</div>
</main>
<!-- Background Atmospheric Image (Level 0 depth cue) -->
<div class="fixed inset-0 w-full h-full z-0 opacity-20 pointer-events-none">
<div class="w-full h-full bg-cover bg-center mix-blend-screen" data-alt="A sleek, futuristic dark-mode abstract background featuring deep obsidian blacks and subtle royal blue geometric glowing lines, reminiscent of a high-tech instrument panel or modern cockpit display interface at night, professional and precise." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAbcEZcgf8x98e3z2iuq4h_ryCV6dYrfhFeWtxGT6-CpGOzs9l-vaOSOXh2HLAn04scWu-hVVKTsIq4nHH6BHv3q2c76UZLrTvrtrxN0-GeyCBKGmssNE184ZI4MkD8LjtFW5xcxex7C94WKyvf-7A0RweijSL8PI5O8-szP7mZmWJ_RGykNWN5sgnLAR-M-njifJiFPVY6ktVk0NloFeRRLhMaGOfFbgxvMsIYnciSVQqp1yWghTo')"></div>
</div>
<!-- Decorative Top Accent Line -->
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<script>
        // Simple input formatting script for demonstration
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', function (e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
    </script>
