<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full sticky top-0 bg-surface-container-low border-b border-outline-variant z-40">
<div class="flex items-center justify-between px-margin-mobile h-touch-target-min">
<button aria-label="Back" class="w-touch-target-min h-touch-target-min flex items-center justify-center -ml-3 text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface flex-1 text-center">Notifications</h1>
<button class="h-touch-target-min flex items-center justify-center -mr-3 px-3 text-primary dark:text-primary font-label-md text-label-md hover:bg-surface-container-high transition-colors active:scale-95 duration-200 rounded-lg">
                Mark all as read
            </button>
</div>
<!-- Filter Tabs -->
<div class="w-full overflow-x-auto no-scrollbar pb-3 px-margin-mobile pt-1">
<div class="flex space-x-2">
<button class="h-8 px-4 rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform">

<button class="h-8 px-4 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-high">
                    Earnings
                </button>
<button class="h-8 px-4 rounded-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-high">
                    Support
                </button>
</div>
</div>
</header>

<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 duration-150 group">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-[10px] mt-0.5 leading-none">Home</span>
</button>
