<script>
        // Simple Confetti Explosion Effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#10b981', '#2563eb', '#ffb596', '#ffffff']; // Success Green, Primary Blue, Tertiary Gold, White
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize properties
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100 + '%';
                const animDuration = Math.random() * 1 + 1 + 's';
                const animDelay = Math.random() * 0.5 + 's';
                
                confetti.style.backgroundColor = color;
                confetti.style.left = left;
                confetti.style.top = '50%';
                confetti.style.animation = `float ${animDuration} ease-out ${animDelay} forwards`;
                
                // Add varied shapes
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }
                
                container.appendChild(confetti);
            }
        });
        
        // Define missing animations in style tag to prevent console errors if used later
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes shimmer {
                100% { transform: translateX(100%); }
            }
        `;
        document.head.appendChild(styleSheet);
    </script>
