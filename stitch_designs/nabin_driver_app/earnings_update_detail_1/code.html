<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Earnings Detail - Driver App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#b4c5ff",
                    "surface-container-low": "#191b23",
                    "on-secondary-fixed": "#181c21",
                    "tertiary-fixed": "#ffdbcd",
                    "on-background": "#e1e2ed",
                    "on-secondary-container": "#b2b5bc",
                    "on-secondary": "#2d3136",
                    "on-primary-fixed": "#00174b",
                    "surface-container-lowest": "#0c0e16",
                    "on-surface": "#e1e2ed",
                    "background": "#11131b",
                    "on-secondary-fixed-variant": "#43474d",
                    "on-surface-variant": "#c3c6d7",
                    "on-tertiary": "#581e00",
                    "outline-variant": "#434655",
                    "on-tertiary-fixed": "#360f00",
                    "secondary": "#c3c6ce",
                    "error-container": "#93000a",
                    "on-tertiary-container": "#ffede6",
                    "secondary-fixed": "#e0e2ea",
                    "on-primary": "#002a78",
                    "primary-container": "#2563eb",
                    "inverse-on-surface": "#2e3039",
                    "surface-bright": "#373942",
                    "surface-tint": "#b4c5ff",
                    "surface-container-high": "#282a32",
                    "inverse-surface": "#e1e2ed",
                    "secondary-container": "#43474d",
                    "surface-container-highest": "#32343d",
                    "on-primary-fixed-variant": "#003ea8",
                    "surface": "#11131b",
                    "surface-dim": "#11131b",
                    "inverse-primary": "#0053db",
                    "secondary-fixed-dim": "#c3c6ce",
                    "surface-container": "#1d1f27",
                    "tertiary": "#ffb596",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-primary-container": "#eeefff",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#32343d",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "tertiary-container": "#bc4800",
                    "error": "#ffb4ab",
                    "primary-fixed": "#dbe1ff",
                    "tertiary-fixed-dim": "#ffb596",
                    "on-error": "#690005",
                    "outline": "#8d90a0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "stack-md": "16px",
                    "gutter": "16px",
                    "margin-desktop": "32px",
                    "base": "4px",
                    "touch-target-min": "48px",
                    "stack-sm": "8px",
                    "stack-lg": "24px"
            },
            "fontFamily": {
                    "headline-xl": ["Inter"],
                    "data-tabular": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"]
            },
            "fontSize": {
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "data-tabular": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #0B0F14; /* Global Background */
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-edge {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .level-1-card {
            background-color: #111827;
        }

        .level-2-surface {
            background-color: #17202B;
        }
    </style>
</head>
<body class="min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 border-b border-white/10 bg-surface-container">
<div class="flex items-center h-14 px-margin-mobile w-full">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-primary active:scale-95 transition-transform mr-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface flex-1">Earnings Detail</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-margin-mobile max-w-md mx-auto space-y-stack-lg">
<!-- Hero Earnings Display -->
<section class="flex flex-col items-center justify-center pt-8 pb-4 text-center">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">Total Earned</p>
<div class="flex items-baseline space-x-1">
<span class="font-headline-lg text-headline-lg text-primary-container">₹</span>
<span class="text-[48px] leading-[56px] font-bold tracking-tight text-on-surface">280.50</span>
</div>
<!-- Status Pill -->
<div class="mt-6 flex items-center bg-emerald-900/20 glass-edge px-4 py-2 rounded-full">
<span class="material-symbols-outlined text-emerald-400 mr-2 text-[20px]" data-icon="check_circle">check_circle</span>
<span class="font-label-md text-label-md text-emerald-400">Transferred to Wallet</span>
</div>
</section>
<!-- Trip Summary Card -->
<section class="level-1-card rounded-xl p-4 glass-edge">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-4">Trip Summary</h2>
<div class="grid grid-cols-3 gap-4">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant mb-1">Trip ID</span>
<span class="font-data-tabular text-data-tabular text-on-surface">NB-9921</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant mb-1">Date</span>
<span class="font-data-tabular text-data-tabular text-on-surface">Oct 25</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant mb-1">Duration</span>
<span class="font-data-tabular text-data-tabular text-on-surface">18 mins</span>
</div>
</div>
</section>
<!-- Earnings Breakdown List -->
<section class="level-1-card rounded-xl glass-edge overflow-hidden">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider p-4 pb-2">Breakdown</h2>
<ul class="flex flex-col">
<li class="flex justify-between items-center px-4 min-h-[64px] border-b border-[#1E293B]">
<span class="font-body-md text-body-md text-on-surface">Base Fare</span>
<span class="font-data-tabular text-data-tabular text-on-surface">₹180.00</span>
</li>
<li class="flex justify-between items-center px-4 min-h-[64px] border-b border-[#1E293B]">
<div class="flex items-center">
<span class="font-body-md text-body-md text-on-surface">Surge</span>
<span class="ml-2 font-label-md text-label-md text-primary-container bg-primary-container/10 px-2 py-0.5 rounded">1.2x</span>
</div>
<span class="font-data-tabular text-data-tabular text-on-surface">₹36.00</span>
</li>
<li class="flex justify-between items-center px-4 min-h-[64px] border-b border-[#1E293B]">
<span class="font-body-md text-body-md text-on-surface">Performance Bonus</span>
<span class="font-data-tabular text-data-tabular text-emerald-400">+₹40.00</span>
</li>
<li class="flex justify-between items-center px-4 min-h-[64px]">
<span class="font-body-md text-body-md text-on-surface">Customer Tip</span>
<span class="font-data-tabular text-data-tabular text-emerald-400">+₹24.50</span>
</li>
</ul>
</section>
<!-- Action Area -->
<section class="pt-4">
<button class="w-full h-[56px] rounded-lg border border-[#1E293B] bg-transparent text-on-surface font-label-md text-label-md flex items-center justify-center hover:bg-[#1E293B]/50 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined mr-2 text-[20px]" data-icon="history">history</span>
                View Trip History
            </button>
</section>
</main>
<!-- BottomNavBar (Suppressed as this is a transactional detail view per the Semantic Shell Mandate) -->
</body></html>
