<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NABIN Driver - Support Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#e1e2ed",
                    "outline-variant": "#434655",
                    "tertiary-container": "#bc4800",
                    "surface-dim": "#11131b",
                    "on-error": "#690005",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-secondary-fixed-variant": "#43474d",
                    "surface-container": "#1d1f27",
                    "inverse-surface": "#e1e2ed",
                    "secondary-fixed": "#e0e2ea",
                    "on-background": "#e1e2ed",
                    "on-secondary-fixed": "#181c21",
                    "surface-container-high": "#282a32",
                    "tertiary": "#ffb596",
                    "on-primary-container": "#eeefff",
                    "inverse-primary": "#0053db",
                    "on-tertiary": "#581e00",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-container": "#ffede6",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-primary": "#002a78",
                    "primary": "#b4c5ff",
                    "on-secondary-container": "#b2b5bc",
                    "on-tertiary-fixed": "#360f00",
                    "surface-container-lowest": "#0c0e16",
                    "secondary": "#c3c6ce",
                    "tertiary-fixed": "#ffdbcd",
                    "on-primary-fixed": "#00174b",
                    "surface-bright": "#373942",
                    "surface-variant": "#32343d",
                    "surface-container-highest": "#32343d",
                    "error-container": "#93000a",
                    "secondary-fixed-dim": "#c3c6ce",
                    "primary-container": "#2563eb",
                    "primary-fixed": "#dbe1ff",
                    "on-secondary": "#2d3136",
                    "secondary-container": "#43474d",
                    "inverse-on-surface": "#2e3039",
                    "background": "#11131b",
                    "surface-container-low": "#191b23",
                    "error": "#ffb4ab",
                    "surface-tint": "#b4c5ff",
                    "on-surface-variant": "#c3c6d7",
                    "on-primary-fixed-variant": "#003ea8",
                    "outline": "#8d90a0",
                    "tertiary-fixed-dim": "#ffb596",
                    "surface": "#11131b",
                    "success": "#10b981",
                    "on-success": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "24px",
                    "gutter": "16px",
                    "touch-target-min": "48px",
                    "base": "4px",
                    "stack-sm": "8px",
                    "margin-desktop": "32px",
                    "stack-md": "16px",
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "data-tabular": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-xl": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "data-tabular": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container border-b border-outline-variant/10 fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-touch-target-min md:px-margin-desktop md:h-16 transition-colors duration-200">
<button aria-label="Go back" class="text-primary hover:bg-surface-bright/10 active:scale-95 transition-colors duration-200 p-2 rounded-full flex items-center justify-center h-touch-target-min w-touch-target-min">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface md:font-headline-lg md:text-headline-lg">Sarah from Support</h1>
<div class="flex items-center gap-1 mt-1">
<div class="w-2 h-2 rounded-full bg-success"></div>
<span class="font-label-md text-label-md text-on-surface-variant text-[12px]">Online</span>
</div>
</div>
<button aria-label="End Chat" class="text-primary hover:bg-surface-bright/10 active:scale-95 transition-colors duration-200 p-2 rounded-full flex items-center justify-center h-touch-target-min w-touch-target-min text-error">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Chat Canvas (Scrollable) -->
<main class="flex-1 overflow-y-auto pt-[80px] pb-[160px] px-margin-mobile md:px-margin-desktop space-y-stack-md flex flex-col">
<!-- System Message / Timestamp -->
<div class="flex justify-center my-stack-sm">
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-container-low px-3 py-1 rounded-full">Today, 10:42 AM</span>
</div>
<!-- Agent Message -->
<div class="flex items-start gap-3 max-w-[85%] md:max-w-[70%]">
<div class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant/20 flex-shrink-0 flex items-center justify-center overflow-hidden">
<img alt="Sarah" class="w-full h-full object-cover" data-alt="A professional headshot of a female customer support agent wearing a headset, smiling slightly, set against a dark premium tech background with subtle blue rim lighting to match the app's professional driver aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2Uc0-Qzli5kchgAhDlbXKVQ5lz1rXDj0FMzd_j2iGegLyiFbitYB1RSTSD82czp9GFGiWNpxGQ3h5PhpbgyPgCkQeVRquapLSHCFbr_7VZR4hKGwJcw6LqmzQMgGI1JBBw6DZX24UpNhxbYL9J6e040TF-YuWb-Fx_vS06EmaF-BmMahRl1Mci-6PbwMYkG6DJweX-fbAugBN7UWWN9goAsNvJzw_-cXlbG6pnngy7rKD9_y7iRI"/>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant ml-1">Sarah</span>
<div class="bg-surface-container-high text-on-surface p-3 rounded-2xl rounded-tl-none shadow-sm border border-outline-variant/10 shadow-[inset_0_1px_0_rgba(255,255,255,0.05)]">
<p class="font-body-md text-body-md">Hi Alex! I see you're having trouble with your recent payout. I'm here to help.</p>
</div>
<span class="font-label-md text-label-md text-on-surface-variant text-[11px] ml-1">10:42 AM</span>
</div>
</div>
<!-- Driver Message -->
<div class="flex items-end justify-end gap-3 max-w-[85%] md:max-w-[70%] ml-auto">
<div class="flex flex-col gap-1 items-end">
<div class="bg-primary-container text-on-primary-container p-3 rounded-2xl rounded-tr-none shadow-sm shadow-[inset_0_1px_0_rgba(255,255,255,0.2)]">
<p class="font-body-md text-body-md">Yes, it's been 2 days and still pending.</p>
</div>
<span class="font-label-md text-label-md text-on-surface-variant text-[11px] mr-1 flex items-center gap-1">
                    10:45 AM
                    <span class="material-symbols-outlined text-[14px] text-primary" data-icon="done_all">done_all</span>
</span>
</div>
</div>
<!-- Agent Message -->
<div class="flex items-start gap-3 max-w-[85%] md:max-w-[70%]">
<div class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant/20 flex-shrink-0 flex items-center justify-center overflow-hidden">
<img alt="Sarah" class="w-full h-full object-cover" data-alt="A professional headshot of a female customer support agent wearing a headset, smiling slightly, set against a dark premium tech background with subtle blue rim lighting to match the app's professional driver aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAx-KLnoxKj8e64DF540cyTNDd3MKuCdTUWzxXrlHCDknJC61RwRMyuvHY12NWf8pU5ZxW8t_i0trF7tMoiwFuW9hbcIhNI41in127DrjcLvojre1RyH1WLelUcMC9UGjUbJ1lwRPodC0dzDFQjQrJNAVVUnkpRO5bhgT27rls9YflzYff1LG9oe9HkMFIIVK7i4k2ngiJOj-VB9f4jBH33BxmTkf2EixR9guWjs6xwjzvfzwBNLT8"/>
</div>
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant ml-1">Sarah</span>
<div class="bg-surface-container-high text-on-surface p-3 rounded-2xl rounded-tl-none shadow-sm border border-outline-variant/10 shadow-[inset_0_1px_0_rgba(255,255,255,0.05)]">
<p class="font-body-md text-body-md">Let me check that for you right now. One moment please.</p>
</div>
<!-- Typing indicator -->
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-2xl w-16 mt-2 border border-outline-variant/10 flex items-center justify-center gap-1 shadow-[inset_0_1px_0_rgba(255,255,255,0.05)]">
<div class="w-2 h-2 bg-outline rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
<div class="w-2 h-2 bg-outline rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
<div class="w-2 h-2 bg-outline rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
</div>
</div>
</div>
<!-- Bottom padding for fixed input -->
<div class="h-4"></div>
</main>
<!-- Bottom Input Area (Fixed) -->
<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/10 z-40 pb-safe">
<!-- Quick Replies -->
<div class="flex overflow-x-auto gap-stack-sm px-margin-mobile py-stack-sm no-scrollbar border-b border-outline-variant/5">
<button class="flex-shrink-0 bg-surface-container-high hover:bg-surface-bright text-primary font-label-md text-label-md px-4 py-2 rounded-full border border-primary/30 transition-colors shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] whitespace-nowrap">
                Check Payout Status
            </button>
<button class="flex-shrink-0 bg-surface-container-high hover:bg-surface-bright text-on-surface font-label-md text-label-md px-4 py-2 rounded-full border border-outline-variant/30 transition-colors shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] whitespace-nowrap">
                Report App Bug
            </button>
<button class="flex-shrink-0 bg-surface-container-high hover:bg-surface-bright text-on-surface font-label-md text-label-md px-4 py-2 rounded-full border border-outline-variant/30 transition-colors shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] whitespace-nowrap">
                Payment Error
            </button>
</div>
<!-- Input Field -->
<div class="flex items-center gap-2 px-margin-mobile py-stack-md">
<button aria-label="Add attachment" class="text-on-surface-variant hover:text-primary transition-colors p-2 rounded-full h-touch-target-min w-touch-target-min flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<div class="flex-1 bg-surface-container-high border border-outline-variant/30 rounded-xl flex items-center px-4 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-[inset_0_1px_0_rgba(255,255,255,0.05)] min-h-[48px]">
<input class="w-full bg-transparent border-none text-on-surface font-body-md placeholder:text-on-surface-variant focus:ring-0 p-0" placeholder="Type a message..." type="text"/>
</div>
<button aria-label="Send message" class="bg-primary-container text-on-primary-container hover:bg-primary transition-colors rounded-full h-touch-target-min w-touch-target-min flex items-center justify-center flex-shrink-0 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<style>
        /* Hide scrollbar for quick replies but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* Handle safe area for iOS */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
    </style>
</body></html>
