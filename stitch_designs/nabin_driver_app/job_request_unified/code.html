<script>
        // Simple countdown logic
        document.addEventListener('DOMContentLoaded', () => {
            const timerText = document.getElementById('timer-text');
            const timerRing = document.getElementById('timer-ring');
            const totalTime = 30;
            let timeLeft = totalTime;
            const circumference = 28 * 2 * Math.PI; // 175.93

            const countdown = setInterval(() => {
                timeLeft--;
                if (timerText) timerText.textContent = timeLeft;
                
                if (timerRing) {
                    const offset = circumference - (timeLeft / totalTime) * circumference;
                    timerRing.style.strokeDashoffset = offset;
                }

                if (timeLeft <= 5) {
                    timerText.classList.add('text-error');
                    timerRing.classList.replace('stroke-[#2563eb]', 'stroke-error');
                    timerRing.parentElement.parentElement.classList.replace('bg-surface-container-highest', 'bg-error-container/20');
                }

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    // Handle timeout
                }
            }, 1000);
        });
    </script>
