<body class="bg-background text-on-background h-screen flex flex-col overflow-hidden relative">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim flex justify-between items-center h-14 px-margin-mobile">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center h-touch-target-min w-touch-target-min">
<span class="material-symbols-outlined">location_on</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed tracking-tight text-center flex-1">NABIN</h1>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 p-2 rounded-full flex items-center justify-center h-touch-target-min w-touch-target-min">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Map Area -->
<main class="flex-1 relative w-full h-full">
<img class="w-full h-full object-cover absolute inset-0 z-0" data-alt="A detailed digital map interface showing city streets, parks, and water bodies. The map is in a light mode aesthetic with soft pastel colors, mostly light blues and greens, with crisp white roads. A prominent blue route line connects a starting pin to a destination pin. The style is modern, clean, and functional, resembling a high-end ride-sharing application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCsLA0O_OsMFpiDuDEoxtfNhLKEKVgVHab8Ee9wO9az3DYqPCMqnIIM3jidcM_IVioR3GK2FQvKblqkorYKQUT6JT5__RB7kiQViwPSWOipOdPZjWP7lmb2Bmm3-z3-6JVY8oYsrMx-_a2Et1QAtoyopn9hq6kKmKPRamr7DKs9mxsiRnH5v-YxDMcKztKdhK_wOpCostfrMc55n_JGA6dZTiiOee4k8tI5mEfQW7h0uRrYLLHI6WJibQ"/>
<!-- Back Button Overlay -->
<button class="absolute top-4 left-4 z-10 bg-surface text-primary rounded-full p-2 shadow-[0_4px_12px_0_rgba(0,0,0,0.12)] h-touch-target-min w-touch-target-min flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Location Search / Edit Sheet (Floating) -->
<div class="absolute top-20 left-4 right-4 z-10 bg-surface rounded-xl shadow-[0_4px_12px_0_rgba(0,0,0,0.12)] p-4 flex flex-col gap-sm">
<div class="flex items-center bg-surface-container-low border border-outline-variant rounded-lg px-3 h-12">
<span class="material-symbols-outlined text-secondary mr-2">radio_button_checked</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-on-surface p-0 outline-none" readonly="" type="text" value="Current Location"/>
</div>
<div class="flex items-center bg-surface-container-low border border-primary rounded-lg px-3 h-12">
<span class="material-symbols-outlined text-primary mr-2">location_on</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-on-surface p-0 outline-none" type="text" value="Central Business District"/>
</div>
</div>
</main>
<!-- Bottom Sheet: Vehicle Selection -->
<section class="bg-surface w-full rounded-t-2xl shadow-[0_-8px_20px_0_rgba(0,0,0,0.12)] z-20 flex flex-col pb-safe">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<div class="px-margin-mobile pt-2 pb-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Select a Ride</h2>
<div class="flex flex-col gap-sm mb-lg">
<!-- Vehicle Option: Bike -->
<button class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center justify-between hover:bg-surface-container-low active:bg-surface-container-high transition-colors text-left focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary h-[80px]">
<div class="flex items-center gap-md">
<div class="w-16 h-12 rounded flex items-center justify-center bg-surface-container-low shrink-0">
<img class="h-10 object-contain" data-alt="A clean, minimalist 3D rendering of a blue delivery scooter or motorbike on a white background. The style is modern, corporate, and functional, matching a high-end logistics or ride-sharing app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLc_VLcEETG2wCOdEc3o2zOKk9QScAdH37nAKVEP1BrV1s3CePHr2gkO5rafBs9sxHsBBRjLWAljfBRlx9pQzQmodQ4Xv1Xe5pZrOTXOuTBZc_YBLklVMBjKdE7N3CAebDoMZTiIi2keya9smQg4myh1evPrMl-koXAql3IbaZVEynugTPhVZTDimRnQNSZvDvxTaSQ6vlXrtY2PIg0j_2UTveIBqmFVZh9uO2nFJmL19rBVdKdI_ELQ"/>
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold">Bike</h3>
<div class="flex items-center text-secondary mt-1">
<span class="material-symbols-outlined text-[16px] mr-1">schedule</span>
<span class="font-body-sm text-body-sm">3 mins</span>
</div>
</div>
</div>
<div class="text-right">
<span class="font-headline-md text-headline-md text-on-surface">$4.50</span>
</div>
</button>
<!-- Vehicle Option: Auto (Selected) -->
<button class="w-full bg-primary-fixed border-2 border-primary rounded-xl p-3 flex items-center justify-between transition-colors text-left focus:outline-none h-[80px] shadow-[0_4px_12px_0_rgba(0,0,0,0.05)] relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-primary"></div>
<div class="flex items-center gap-md">
<div class="w-16 h-12 rounded flex items-center justify-center bg-surface-container-lowest shrink-0">
<img class="h-10 object-contain" data-alt="A clean, minimalist 3D rendering of an auto rickshaw or tuk-tuk painted in bright corporate blue on a white background. The style is modern and functional, matching a high-end ride-sharing app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCkG3h-eBGIwZBJnlkgnln5SHT5o20unGWMdy66I3fQgmj2Bt6_7gyfEXG9B4_nRKglNPDvjhoJyqTY7d3eKeAM2pH5ICPVswGX7ri5CGyj5Q9jdv_aLt7F2MF_9ultA4gSguHxczbVRPKgyGgH9eCeiZleitZs8Yh1ObwvPkXb4Ylfhbs41Waqxp2iJlAq19CqBBOicwCFOCZOOqJqYwnHNKLBD-ttBabrLyGPGv9bkB6zIKVcxygcsg"/>
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-primary-fixed font-semibold">Auto</h3>
<div class="flex items-center text-on-primary-fixed-variant mt-1">
<span class="material-symbols-outlined text-[16px] mr-1">schedule</span>
<span class="font-body-sm text-body-sm">5 mins</span>
</div>
</div>
</div>
<div class="text-right flex flex-col items-end">
<span class="font-headline-md text-headline-md text-on-primary-fixed">$8.20</span>
<span class="bg-primary text-on-primary font-label-md text-label-md px-2 py-0.5 rounded mt-1">Fastest</span>
</div>
</button>
<!-- Vehicle Option: Car -->
<button class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center justify-between hover:bg-surface-container-low active:bg-surface-container-high transition-colors text-left focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary h-[80px]">
<div class="flex items-center gap-md">
<div class="w-16 h-12 rounded flex items-center justify-center bg-surface-container-low shrink-0">
<img class="h-10 object-contain" data-alt="A clean, minimalist 3D rendering of a modern sedan car in dark grey or black on a white background. The style is modern, corporate, and functional, matching a high-end ride-sharing app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDOKmHcsjHptVRGra6mSumhK1H7x7AnFGg23L8hPlpgPI-86tDyXNgC9wWzoKV525hl1-OOxkoGX-JpJzehZoeIp0lHRA3rO12Uy1X6M7kqFMTKRCGBpIRwMBfFG1k1kfMwsF3QwK9AAJudUxPxaL_D0wlirS31Oag_rb5OXicxxLCdBwOpNw_BOAIJezT3yBjIKVn41u48YOTSCsJuFdaxg3-Y700987bG6T-BzEW0izSTpppzGw8aMQ"/>
</div>
<div>
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold">Car</h3>
<div class="flex items-center text-secondary mt-1">
<span class="material-symbols-outlined text-[16px] mr-1">schedule</span>
<span class="font-body-sm text-body-sm">8 mins</span>
</div>
</div>
</div>
<div class="text-right">
<span class="font-headline-md text-headline-md text-on-surface">$12.00</span>
</div>
</button>
</div>
<!-- Payment Method & Promos (Optional but good UX) -->
<div class="flex justify-between items-center mb-lg px-2">
<button class="flex items-center gap-2 text-primary font-button-text text-button-text active:opacity-70 h-touch-target-min">
<span class="material-symbols-outlined">payments</span>
                    Cash
                    <span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
<button class="flex items-center gap-1 text-on-surface-variant font-button-text text-button-text active:opacity-70 h-touch-target-min">
<span class="material-symbols-outlined text-[20px]">local_offer</span>
                    Promo
                </button>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary font-button-text text-button-text h-[56px] rounded-lg shadow-[0_4px_12px_0_rgba(0,0,0,0.12)] hover:bg-primary transition-colors active:scale-95 duration-100 flex items-center justify-center">
                Confirm Booking
            </button>
</div>
</section>
</body></html>
