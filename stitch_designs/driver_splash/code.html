<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>NABIN Driver - Splash</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00296d",
            "primary-container": "#003d9b",
            "secondary": "#006e2a",
            "surface": "#fcf9f8",
            "outline": "#747783"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#00296d] text-white h-screen w-screen overflow-hidden flex flex-col justify-between p-8 font-sans select-none">
  
  <!-- Top Version Badge -->
  <div class="w-full flex justify-end">
    <span class="px-3 py-1 rounded-full bg-white/10 text-xs font-semibold backdrop-blur-md">v2.4.0 (Unified)</span>
  </div>

  <!-- Center Logo & Branding -->
  <div class="flex flex-col items-center text-center">
    <div class="w-24 h-24 rounded-3xl bg-white flex items-center justify-center shadow-2xl shadow-blue-950/60 mb-6 relative">
      <span class="material-symbols-outlined text-5xl text-[#003D9B]">electric_rickshaw</span>
      <span class="absolute -top-2 -right-2 w-7 h-7 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center text-white text-xs font-black">
        ✓
      </span>
    </div>
    <h1 class="text-3xl font-black tracking-tight mb-2">NABIN DRIVER</h1>
    <p class="text-blue-100 text-sm font-medium max-w-xs">
      Unified Partner Console for Bike, Auto & Cab rides, Parcels and Food deliveries.
    </p>

    <div class="flex items-center gap-2 mt-6">
      <span class="px-3 py-1 rounded-xl bg-white/15 text-xs font-bold">🛵 2W Bike</span>
      <span class="px-3 py-1 rounded-xl bg-white/15 text-xs font-bold">🛺 3W Auto</span>
      <span class="px-3 py-1 rounded-xl bg-white/15 text-xs font-bold">🚗 4W Cab</span>
    </div>
  </div>

  <!-- Bottom CTA Actions -->
  <div class="w-full flex flex-col gap-3">
    <a href="../driver_login/code.html" class="w-full h-14 bg-white hover:bg-slate-100 text-[#00296d] font-black rounded-2xl text-base flex items-center justify-center gap-2 shadow-lg active:scale-[0.98] transition">
      <span>Partner Login / Sign In</span>
      <span class="material-symbols-outlined text-lg">arrow_forward</span>
    </a>
    <a href="../driver_kyc_compliance/code.html" class="w-full h-12 bg-white/10 hover:bg-white/20 text-white font-bold rounded-2xl text-xs flex items-center justify-center gap-1.5 backdrop-blur-sm transition">
      <span>Register New Vehicle (KYC)</span>
      <span class="material-symbols-outlined text-sm">badge</span>
    </a>
  </div>

</body>
</html>
