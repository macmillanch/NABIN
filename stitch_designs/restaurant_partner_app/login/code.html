<!DOCTYPE html><html class="light" lang="en"><head>

                    "spacing": {

                        "margin-mobile": "16px",
                        "touch-target-min": "48px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased">
<!-- Left/Top Section: Branding & Imagery -->
<div class="relative w-full md:w-1/2 min-h-[30vh] md:min-h-screen bg-surface-container-high flex flex-col justify-center items-center overflow-hidden">
<!-- Abstract Background Image -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="A modern, high-contrast abstract architectural visualization of a fast-paced commercial kitchen or sleek modern restaurant space. The lighting is crisp and efficient, casting sharp shadows that emphasize productivity and speed. The color palette focuses on soft whites, slate grays, and subtle accents of royal blue (#004ac6). The scene is clean, organized, and slightly blurred to serve as an unobtrusive background for a corporate app login screen. The overall mood is professional, reliable, and hyper-functional." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDglE7klvdQQQKjIcT-8rWAVpu1esM4___IsBR5wi0HiTDNcKHmDZ6CjDT63asfNZQkSaTBZ9PEHafQLintV60l94IbV6nPGLQ-8smIIG_I7_Cvq2aiw8EATVPye46SHaAXSJrQsxA1cHh1POMlub_759aR-p_mt2iEuoDCqIjhTyQHc49IC0spqYcVNpaNRavOQhSzIOBv_-2sTUrP4yg03ifRTKPqcRTcqHHUBK_o_jkETwcqVxmh">
<div class="absolute inset-0 bg-primary/10"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background/90 via-background/40 to-transparent md:bg-gradient-to-r md:from-transparent md:via-background/50 md:to-background"></div>
</div>
<!-- Brand Content -->
<div class="relative z-10 text-center px-margin-mobile py-xl md:px-margin-tablet">
<div class="flex items-center justify-center gap-sm mb-lg">
<span class="material-symbols-outlined text-headline-lg font-headline-lg text-primary">storefront</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">NABIN</h1>
</div>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto hidden md:block">
                Streamline your kitchen operations. Manage orders, menus, and finance with speed and precision.
            </p>
</div>
</div>
<!-- Right/Bottom Section: Login Form -->
<div class="w-full md:w-1/2 flex-1 flex flex-col justify-center px-margin-mobile py-xl md:px-xl bg-background relative z-10">
<div class="w-full max-w-md mx-auto">
<!-- Greeting -->
<div class="mb-xl">
<h2 class="font-headline-md text-headline-md text-on-background mb-xs">Welcome Partner</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your mobile number to access your dashboard.</p>
</div>
<!-- Login Form -->
<form class="space-y-gutter" onsubmit="event.preventDefault();">
<!-- Mobile Number Input -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface" for="mobile">Mobile Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
<span class="material-symbols-outlined text-outline">phone_iphone</span>
</div>
<input class="w-full h-touch-target-min pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface transition-shadow" id="mobile" name="mobile" placeholder="+1 (555) 000-0000" required="" type="tel">
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min bg-primary-container text-on-primary font-bold text-label-lg rounded-DEFAULT hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-sm shadow-md mt-lg py-md" type="submit">
                    Send OTP
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Registration Link -->
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to NABIN? 
                    <a class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant hover:underline transition-all" href="#">
                        Register as a Partner
                    </a>
</p>
</div>
<!-- Support Link -->
<div class="mt-md text-center">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="#">
<span class="material-symbols-outlined text-[14px]">help</span>
                    Need help logging in?
                </a>
</div>
</div>
</div>


</body></html>
