<script>
        // Simple script to simulate countdown timer urgency
        document.addEventListener('DOMContentLoaded', () => {
            let seconds = 45;
            const timerEl = document.getElementById('order-timer');
            const progressBar = document.querySelector('.bg-error');
            
            setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                // Increase urgency visually
                if(seconds > 60) {
                    timerEl.classList.add('text-error');
                    timerEl.classList.remove('text-on-primary');
                    progressBar.style.width = Math.min((seconds / 120) * 100, 100) + '%';
                }
            }, 1000);
        });
    </script>
