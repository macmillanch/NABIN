<style>
        body { font-family: 'Inter', sans-serif; }

        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-tablet">
<!-- Main Container: Glassmorphism / Clean Corporate Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-md p-lg md:p-xl flex flex-col gap-lg relative overflow-hidden">
<!-- Decorative Header Element -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<!-- Header -->
<header class="text-center flex flex-col items-center gap-sm mt-sm">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-sm text-primary">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Verification</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                We've sent a 6-digit verification code to your device. Please enter it below.
            </p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-lg w-full" id="otp-form">
<!-- OTP Input Group -->
<div class="flex justify-between gap-sm w-full" id="otp-inputs">
<input aria-label="Digit 1" class="otp-input w-12 h-16 md:w-14 md:h-16 bg-surface-container text-center font-headline-md text-headline-md text-on-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-colors" maxlength="1" type="number">
<input aria-label="Digit 2" class="otp-input w-12 h-16 md:w-14 md:h-16 bg-surface-container text-center font-headline-md text-headline-md text-on-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-colors" maxlength="1" type="number">
<input aria-label="Digit 3" class="otp-input w-12 h-16 md:w-14 md:h-16 bg-surface-container text-center font-headline-md text-headline-md text-on-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-colors" maxlength="1" type="number">
<input aria-label="Digit 4" class="otp-input w-12 h-16 md:w-14 md:h-16 bg-surface-container text-center font-headline-md text-headline-md text-on-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-colors" maxlength="1" type="number">
<input aria-label="Digit 5" class="otp-input w-12 h-16 md:w-14 md:h-16 bg-surface-container text-center font-headline-md text-headline-md text-on-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-colors" maxlength="1" type="number">
<input aria-label="Digit 6" class="otp-input w-12 h-16 md:w-14 md:h-16 bg-surface-container text-center font-headline-md text-headline-md text-on-surface border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-colors" maxlength="1" type="number">
</div>
<!-- Resend Timer -->
<div class="text-center font-label-md text-label-md text-on-surface-variant flex flex-col gap-xs">
<span class="">Didn't receive the code?</span>
<button class="font-label-lg text-label-lg text-primary disabled:cursor-not-allowed hover:text-primary-container transition-colors" id="resend-btn" type="button">Resend Code Now</button>
</div>
<!-- Action Button -->
<button class="w-full h-touch-target-min bg-primary-container text-on-primary font-label-lg text-label-lg font-bold rounded-lg shadow-md hover:bg-primary transition-colors focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:outline-none flex items-center justify-center gap-sm mt-sm" type="submit">
<span class="">Verify &amp; Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Back Link -->
<div class="text-center">
<button class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors flex items-center justify-center gap-xs mx-auto" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                Back to Login
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const timerSpan = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            let timeLeft = 30;
            let timerId;

            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1); // Restrict to 1 char
                    }
                    if (e.target.value !== '' && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/[^0-9]/g, '');
                    for (let i = 0; i < pastedData.length; i++) {
                        if (i < inputs.length) {
                            inputs[i].value = pastedData[i];
                            if (i < inputs.length - 1) inputs[i + 1].focus();
                        }
                    }
                });
            });

            // Timer Logic
            function startTimer() {
                timeLeft = 30;
                resendBtn.disabled = true;
                resendBtn.classList.add('disabled:text-outline');
                
                clearInterval(timerId);
                timerId = setInterval(() => {
                    timeLeft--;
                    const seconds = timeLeft.toString().padStart(2, '0');
                    timerSpan.textContent = `00:${seconds}`;
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        resendBtn.disabled = false;
                        timerSpan.textContent = '';
                        resendBtn.innerHTML = 'Resend Code Now';
                        resendBtn.classList.remove('disabled:text-outline');
                    }
                }, 1000);
            }

            resendBtn.addEventListener('click', () => {
                if (!resendBtn.disabled) {
                    resendBtn.innerHTML = 'Resend Code in <span id="timer">00:30</span>';
                    startTimer();
                    // Clear inputs on resend (optional UX choice)
                    inputs.forEach(input => input.value = '');
                    inputs[0].focus();
                }
            });

            // Start initial timer
            startTimer();
            
            // Auto focus first input
            setTimeout(() => inputs[0].focus(), 100);
        });
    </script>
