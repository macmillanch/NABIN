<style>
        .splash-fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .pulse-slow {
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Top Nav is suppressed as this is a transactional/onboarding splash screen -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Subtle Background Accent -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-5 pointer-events-none">
<span class="material-symbols-outlined text-[400px] text-primary" data-icon="restaurant">restaurant</span>
</div>

<span class="material-symbols-outlined text-on-primary text-[64px]" data-icon="storefront" style="font-variation-settings: 'FILL' 1;">storefront</span>

<div class="flex flex-col gap-md">
<button class="bg-primary text-on-primary font-label-lg text-label-lg rounded-full h-touch-target-min w-full flex items-center justify-center hover:bg-primary-container transition-colors shadow-sm">

</button>
<button class="bg-surface-container-lowest text-primary border border-outline-variant font-label-lg text-label-lg rounded-full h-touch-target-min w-full flex items-center justify-center hover:bg-surface-container-low transition-colors">
