<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background min-h-screen font-sans text-on-background flex flex-col md:flex-row antialiased">
<!-- Top Navigation for Desktop (Suppressed on Mobile for Transactional Flow, but structural header exists) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-tablet h-touch-target-min bg-surface border-b border-outline-variant flat no shadows">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="storefront">storefront</span>
<span class="font-headline-md text-headline-md font-bold text-primary">NABIN</span>
</div>
<button aria-label="Close" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[48px] px-margin-mobile md:px-margin-tablet py-xl max-w-3xl mx-auto w-full flex flex-col items-center justify-center min-h-[calc(100vh-48px)]">
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-md w-full max-w-md p-lg flex flex-col gap-lg">
<!-- Warning Header -->
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-16 h-16 rounded-full bg-error-container flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-error text-4xl" data-icon="warning">warning</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">Are you absolutely sure?</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                    This action will delete all restaurant data, menus, order history, and account settings <strong class="text-error">permanently</strong>. This cannot be undone.
                </p>
</div>
<!-- Confirmation Checkbox -->
<label class="flex items-start gap-sm p-sm rounded-lg border border-outline-variant bg-surface-container-low cursor-pointer hover:bg-surface-container transition-colors">
<input class="mt-1 w-5 h-5 text-error focus:ring-error rounded border-outline cursor-pointer" id="confirm-deletion" type="checkbox">
<span class="font-body-md text-body-md select-none text-on-background" style="opacity: 0;">I confirm that I want to delete my account and all associated data.</span>
</label>
<!-- Actions -->
<div class="flex flex-col gap-sm mt-md">
<button class="h-touch-target-min w-full bg-error text-on-error font-label-lg text-label-lg rounded-DEFAULT flex items-center justify-center gap-xs disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-95" disabled="" id="btn-deactivate"><span class="material-symbols-outlined" data-icon="delete_forever">delete_forever</span>Delete Account</button>
<button class="h-touch-target-min w-full bg-surface-container-lowest border border-outline text-on-surface font-label-lg text-label-lg rounded-DEFAULT flex items-center justify-center hover:bg-surface-container-low transition-all active:scale-95">
                    Cancel
                </button>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkbox = document.getElementById('confirm-deletion');
            const deactivateBtn = document.getElementById('btn-deactivate');

            checkbox.addEventListener('change', (e) => {
                deactivateBtn.disabled = !e.target.checked;
                if(e.target.checked) {
                    deactivateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    deactivateBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>


</body></html>
