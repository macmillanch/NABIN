<!DOCTYPE html><html class="light" lang="en"><head>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Level 0 Background */
            color: #191b23;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c3c6d7; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #737686; 
        }
    </style>
</head>
<body class="min-h-screen bg-background text-on-background antialiased flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-touch-target-min">
<button aria-label="Storefront" class="text-primary dark:text-inverse-primary hover:bg-surface-container-low transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">storefront</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary tracking-tight">NABIN</h1>
<button aria-label="Notifications" class="text-primary dark:text-inverse-primary hover:bg-surface-container-low transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</button>
</header>
<!-- Main Content Area (Registration Flow) -->
<main class="flex-grow pt-[calc(48px+32px)] pb-[calc(48px+32px)] px-margin-mobile md:px-margin-tablet max-w-4xl mx-auto w-full flex flex-col items-center">
<!-- Registration Header -->
<div class="w-full text-center mb-xl">
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-sm">Partner Registration</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Let's get your restaurant set up on the NABIN platform.</p>
</div>
<!-- Progress Bar (Multi-step) -->
<div class="w-full max-w-2xl mb-xl">
<div class="flex items-center justify-between relative">
<!-- Line -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-surface-variant z-0 rounded-full"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-1 bg-primary z-0 rounded-full transition-all duration-300"></div>
<!-- Steps -->
<div class="relative z-10 flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-lg text-label-lg shadow-md mb-xs">
                        1
                    </div>
<span class="font-label-md text-label-md text-primary">General</span>
</div>
<div class="relative z-10 flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant border-2 border-surface-variant flex items-center justify-center font-label-lg text-label-lg mb-xs transition-colors">
                        2
                    </div>
<span class="font-label-md text-label-md text-on-surface-variant">Menu</span>
</div>
<div class="relative z-10 flex flex-col items-center group">
<div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant border-2 border-surface-variant flex items-center justify-center font-label-lg text-label-lg mb-xs transition-colors">
                        3
                    </div>
<span class="font-label-md text-label-md text-on-surface-variant">Banking</span>
</div>
</div>
</div>
<!-- Registration Form Card -->
<div class="w-full max-w-2xl bg-surface-container-lowest border border-outline-variant shadow-sm rounded-xl p-margin-mobile md:p-margin-tablet">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-lg border-b border-surface-variant pb-xs">General Information</h3>
<form class="flex flex-col gap-lg">
<!-- Restaurant Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="restaurant-name">Restaurant Name</label>
<input class="h-touch-target-min w-full rounded-lg border-outline-variant bg-surface-bright px-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="restaurant-name" name="restaurant-name" placeholder="e.g. The Rustic Spoon" required="" type="text">
</div>
<!-- Cuisine Type -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="cuisine-type">Primary Cuisine Type</label>
<div class="relative">
<select class="h-touch-target-min w-full appearance-none rounded-lg border-outline-variant bg-surface-bright px-md font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors pr-10" id="cuisine-type" name="cuisine-type" required="">
<option disabled="" selected="" value="">Select cuisine type</option>
<option value="american">American</option>
<option value="italian">Italian</option>
<option value="mexican">Mexican</option>
<option value="asian">Asian Fusion</option>
<option value="indian">Indian</option>
<option value="cafe">Cafe / Bakery</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-md text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Contact Person -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="contact-fname">First Name</label>
<input class="h-touch-target-min w-full rounded-lg border-outline-variant bg-surface-bright px-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="contact-fname" name="contact-fname" placeholder="Jane" required="" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="contact-lname">Last Name</label>
<input class="h-touch-target-min w-full rounded-lg border-outline-variant bg-surface-bright px-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="contact-lname" name="contact-lname" placeholder="Doe" required="" type="text">
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="contact-phone">Phone Number</label>
<input class="h-touch-target-min w-full rounded-lg border-outline-variant bg-surface-bright px-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="contact-phone" name="contact-phone" placeholder="(555) 123-4567" required="" type="tel">
</div>
<!-- Action Buttons -->
<div class="mt-md flex flex-col md:flex-row justify-end gap-md pt-lg border-t border-surface-variant">
<button class="h-touch-target-min px-xl rounded-lg font-label-lg text-label-lg bg-surface-container-lowest text-secondary border border-outline-variant hover:bg-surface-container-low transition-colors" type="button">
                        Cancel
                    </button>
<button class="h-touch-target-min px-xl rounded-lg font-label-lg text-label-lg bg-[#004ac6] text-on-primary hover:bg-[#003ea8] shadow-sm transition-colors flex items-center justify-center gap-2 font-bold p-margin-mobile" type="submit">
                        Continue to Menu
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Bottom Nav is suppressed as this is a transactional flow -->


</body></html>
