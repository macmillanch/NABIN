<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NABIN - Restaurant Registration Flow - Documents &amp; Bank</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "primary-container": "#2563eb",
                        "inverse-on-surface": "#f0f0fb",
                        "outline": "#737686",
                        "on-tertiary-container": "#ffede6",
                        "on-tertiary": "#ffffff",
                        "background": "#faf8ff",
                        "surface-container-low": "#f3f3fe",
                        "surface-container-highest": "#e1e2ed",
                        "surface-variant": "#e1e2ed",
                        "inverse-primary": "#b4c5ff",
                        "error": "#ba1a1a",
                        "primary": "#004ac6",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-bright": "#faf8ff",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary-container": "#d0e1fb",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container": "#ededf9",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "surface-container-high": "#e7e7f3",
                        "on-secondary-container": "#54647a",
                        "surface-tint": "#0053db",
                        "on-secondary-fixed-variant": "#38485d",
                        "secondary": "#505f76",
                        "tertiary": "#943700",
                        "surface-dim": "#d9d9e5",
                        "on-background": "#191b23",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdbcd",
                        "on-tertiary-fixed": "#360f00",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#bc4800",
                        "inverse-surface": "#2e3039",
                        "outline-variant": "#c3c6d7",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-container": "#eeefff",
                        "on-surface-variant": "#434655",
                        "secondary-fixed": "#d3e4fe",
                        "surface": "#faf8ff",
                        "on-surface": "#191b23",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "8px",
                        "md": "16px",
                        "margin-tablet": "24px",
                        "xs": "4px",
                        "lg": "24px",
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "touch-target-min": "48px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "order-number": ["Inter"],
                        "order-number-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "order-number": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "order-number-mobile": ["36px", { "lineHeight": "44px", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- TopAppBar - Suppressed for transactional flow as per instruction, replacing with a simple back-nav header -->
<header class="bg-surface border-b border-outline-variant fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-tablet h-touch-target-min">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">NABIN</span>
<div class="w-touch-target-min"></div> <!-- Placeholder for alignment -->
</header>
<main class="pt-[80px] pb-[100px] px-margin-mobile md:px-margin-tablet max-w-4xl mx-auto flex flex-col gap-lg">
<!-- Progress Indicator -->
<div class="w-full flex items-center justify-between mb-sm">
<div class="flex-1 flex flex-col gap-xs">
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3 rounded-full transition-all duration-500"></div>
</div>
<div class="flex justify-between font-label-md text-label-md text-on-surface-variant">
<span class="">Step 2 of 3</span>
<span class="">Documents &amp; Bank</span>
</div>
</div>
</div>
<div class="flex flex-col gap-xs">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg">Verification Details</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Upload required documents and provide bank details for payouts.</p>
</div>
<!-- Bento Grid Layout for forms -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Document Upload Section -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md md:p-lg shadow-sm flex flex-col gap-md">
<h2 class="font-headline-sm text-headline-sm border-b border-surface-variant pb-xs">Documents</h2>
<!-- FSSAI Upload -->
<div class="flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface">FSSAI License Certificate</label>
<!-- Uploaded State -->
<div class="border border-outline-variant bg-surface-container-low rounded-lg p-sm flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="bg-surface rounded p-xs border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="description">description</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-medium">fssai_cert_2023.pdf</span>
<span class="font-label-md text-label-md text-on-surface-variant">2.4 MB • Uploaded</span>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="bg-[#e6f4ea] text-[#137333] px-2 py-1 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</span>
<button aria-label="Remove file" class="text-error hover:bg-error-container p-xs rounded transition-colors">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</div>
</div>
</div>
<!-- ID Proof Upload -->
<div class="flex flex-col gap-sm mt-sm">
<label class="font-label-lg text-label-lg text-on-surface">Owner ID Proof (Aadhaar/PAN)</label>
<!-- Empty/Upload State -->
<div class="border-2 border-dashed border-outline-variant hover:border-primary bg-surface transition-colors rounded-lg p-md flex flex-col items-center justify-center gap-sm cursor-pointer min-h-[120px]">
<div class="bg-surface-container-highest rounded-full p-sm flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="cloud_upload">cloud_upload</span>
</div>
<div class="text-center">
<span class="font-body-md text-body-md text-primary font-medium block">Click to upload</span>
<span class="font-label-md text-label-md text-on-surface-variant block mt-1">PDF, JPG or PNG (Max 5MB)</span>
</div>
</div>
</div>
</section>
<!-- Bank Details Section -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md md:p-lg shadow-sm flex flex-col gap-md">
<h2 class="font-headline-sm text-headline-sm border-b border-surface-variant pb-xs">Bank Details</h2>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="acc-name">Account Holder Name</label>
<input class="w-full min-h-touch-target-min px-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md" id="acc-name" placeholder="As per bank records" type="text" value="Rahul Sharma">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="acc-num">Account Number</label>
<input class="w-full min-h-touch-target-min px-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md tracking-widest" id="acc-num" placeholder="Enter Account Number" type="password" value="1234567890">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="acc-num-confirm">Confirm Account Number</label>
<div class="relative w-full">
<input class="w-full min-h-touch-target-min px-md border border-[#137333] rounded-lg bg-surface focus:border-[#137333] focus:ring-1 focus:ring-[#137333] outline-none transition-shadow font-body-md text-body-md pr-12" id="acc-num-confirm" placeholder="Re-enter Account Number" type="text" value="1234567890">
<div class="absolute right-md top-1/2 -translate-y-1/2 text-[#137333]">
<span class="material-symbols-outlined" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="ifsc">IFSC Code</label>
<input class="w-full min-h-touch-target-min px-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md uppercase" id="ifsc" placeholder="e.g. HDFC0001234" type="text">
</div>
<div class="mt-sm">
<div class="flex items-center gap-sm">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="font-label-lg text-label-lg font-bold">OR</span>
</div>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
</div>
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-lg text-label-lg text-on-surface" for="upi-id">UPI ID (Optional)</label>
<input class="w-full min-h-touch-target-min px-md border border-outline-variant rounded-lg bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-md text-body-md" id="upi-id" placeholder="yourrestaurant@bank" type="text">
</div>
</form>
</section>
</div>
</main>
<!-- Fixed Bottom Action Bar for Transactional Flow -->
<div class="fixed bottom-0 w-full bg-surface border-t border-outline-variant p-margin-mobile md:px-margin-tablet z-50 flex justify-end gap-md shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="min-h-touch-target-min px-lg bg-surface border border-outline-variant text-on-surface font-label-lg text-label-lg rounded hover:bg-surface-container-low transition-colors">
            Save Draft
        </button>
<button class="min-h-touch-target-min px-lg bg-[#004ac6] text-white font-label-lg text-label-lg rounded hover:bg-[#003ea8] transition-colors flex items-center justify-center gap-sm py-1 font-bold">
            Continue
            <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>


</body></html>
