<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NABIN Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400&amp;family=Geist:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#0079ad",
                        "secondary-fixed-dim": "#b7c8e1",
                        "primary-container": "#4169e1",
                        "inverse-on-surface": "#eff1f3",
                        "surface-dim": "#d8dadc",
                        "inverse-primary": "#b6c4ff",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "surface-container": "#eceef0",
                        "tertiary-fixed-dim": "#89ceff",
                        "secondary-container": "#d0e1fb",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c4c5d6",
                        "primary": "#214fc7",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#00164e",
                        "background": "#f7f9fb",
                        "surface-tint": "#2854cc",
                        "surface-bright": "#f7f9fb",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary": "#005f89",
                        "surface-container-low": "#f2f4f6",
                        "on-surface-variant": "#434654",
                        "secondary": "#505f76",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed": "#c9e6ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-tertiary-fixed": "#001e2f",
                        "on-tertiary": "#ffffff",
                        "outline": "#747685",
                        "primary-fixed-dim": "#b6c4ff",
                        "inverse-surface": "#2d3133",
                        "primary-fixed": "#dce1ff",
                        "on-secondary-container": "#54647a",
                        "on-primary-container": "#f8f7ff",
                        "error-container": "#ffdad6",
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#f3f8ff",
                        "surface-container-high": "#e6e8ea",
                        "on-surface": "#191c1e",
                        "on-primary-fixed-variant": "#003baf",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#004c6e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1.5rem",
                        "margin-mobile": "1rem",
                        "stack-sm": "0.5rem",
                        "stack-xs": "0.25rem",
                        "margin-desktop": "2rem",
                        "stack-md": "1rem",
                        "container-max": "1440px",
                        "stack-lg": "2rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "mono-sm": ["Geist"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Geist"],
                        "display-lg": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "mono-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-background antialiased selection:bg-primary-container selection:text-on-primary">
<main class="w-full max-w-[440px]">
<!-- Brand Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-primary mb-stack-xs tracking-tight">NABIN</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Logistics Control Administration</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-margin-desktop shadow-[0px_10px_25px_-5px_rgba(0,0,0,0.05)]">
<div class="mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-xs">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access the dashboard.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs uppercase" for="email">Work Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="email" name="email" placeholder="dispatcher@nabin.logistics" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-stack-xs">
<label class="block font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary-container/20 focus:border-primary-container transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center mt-stack-sm">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary-container bg-surface cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember this device for 30 days
                    </label>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container font-label-md text-label-md uppercase tracking-wider transition-colors shadow-sm" type="submit">
                        Authenticate Sequence
                    </button>
</div>
</form>
</div>
<!-- Footer / Security Notice -->
<div class="mt-stack-lg text-center flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 1;">shield</span>
<p class="font-mono-sm text-mono-sm text-outline">
                Secured access for authorized personnel only.<br/>
                All connection attempts are logged.
            </p>
</div>
</main>
<script>
        // Simple password toggle visibility logic for UI demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const iconSpan = toggleButton.querySelector('span');

            toggleButton.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    iconSpan.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    iconSpan.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
