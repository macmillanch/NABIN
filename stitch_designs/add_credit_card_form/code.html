<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */

        .card-gradient {
            background: linear-gradient(135deg, #0052cc 0%, #003d9b 100%);
        }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-lg text-body-lg">
<!-- Top App Bar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim flat no shadows flex justify-between items-center h-14 px-margin-mobile">
<button aria-label="Go back" class="h-touch-target-min w-touch-target-min flex items-center justify-center -ml-4 text-on-surface hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_back" data-weight="fill">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Add Card</h1>
<div class="h-touch-target-min w-touch-target-min"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-margin-mobile pt-md pb-[100px] overflow-y-auto no-scrollbar max-w-md mx-auto w-full">
<!-- Interactive Card Preview -->
<div class="w-full aspect-[1.586/1] rounded-xl card-gradient text-white p-lg flex flex-col justify-between shadow-[0_8px_20px_0_rgba(0,82,204,0.2)] mb-xl relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full -translate-y-1/2 translate-x-1/3"></div>
<div class="absolute bottom-0 left-0 w-48 h-48 bg-white/5 rounded-full translate-y-1/3 -translate-x-1/4"></div>
<div class="flex justify-between items-start relative z-10">
<span class="material-symbols-outlined text-[32px] opacity-80" data-icon="contactless">contactless</span>
<div class="h-8 flex items-center justify-center opacity-80 font-bold tracking-widest">
                    VISA
                </div>
</div>
<div class="relative z-10 mt-auto">
<div class="font-headline-md text-headline-md tracking-widest mb-sm opacity-90" id="card-number-display">
                    •••• •••• •••• ••••
                </div>
<div class="flex justify-between items-end">
<div class="flex flex-col">
<span class="font-label-md text-label-md opacity-60 uppercase">Cardholder Name</span>
<span class="font-body-lg text-body-lg opacity-90 truncate max-w-[150px]" id="card-name-display">JOHN DOE</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-md text-label-md opacity-60 uppercase">Valid Thru</span>
<span class="font-body-lg text-body-lg opacity-90" id="card-expiry-display">MM/YY</span>
</div>
</div>
</div>
</div>
<!-- Input Form -->
<form class="space-y-md" id="card-form" oninput="const btn = document.querySelector('div.fixed.bottom-0 button'); const num = document.getElementById('cardNumber').value.replace(/\s/g, '').length &gt;= 13; const exp = /^\d{2}\/\d{2}$/.test(document.getElementById('expiryDate').value); const cvv = document.getElementById('cvv').value.length &gt;= 3; const name = document.getElementById('cardName').value.trim().length &gt; 0; const valid = num &amp;&amp; exp &amp;&amp; cvv &amp;&amp; name; btn.disabled = !valid; btn.classList.toggle('opacity-60', !valid);">
<!-- Card Number -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-1" for="cardNumber">Card Number</label>
<div class="relative flex items-center">
<div class="absolute left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<input autocomplete="cc-number" class="block w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm h-touch-target-min" id="cardNumber" inputmode="numeric" maxlength="19" pattern="[0-9\s]{13,19}" placeholder="0000 0000 0000 0000" type="tel" oninput="this.value = this.value.replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim(); const isValid = this.value.replace(/\s/g, '').length &gt;= 13; this.classList.toggle('border-error', !isValid &amp;&amp; this.value.length &gt; 0); this.classList.toggle('border-primary-container', isValid);">
<div class="absolute right-0 pr-3 flex items-center pointer-events-none text-primary-container">
<span class="material-symbols-outlined text-[18px]" data-icon="lock" data-weight="fill">lock</span>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Expiry Date -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-1" for="expiryDate">Expiry Date</label>
<input class="block w-full px-3 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm h-touch-target-min text-center" id="expiryDate" inputmode="numeric" maxlength="5" placeholder="MM/YY" type="tel" oninput="let v = this.value.replace(/\D/g, ''); if (v.length &gt; 2) v = v.slice(0,2) + '/' + v.slice(2,4); this.value = v; const isValid = /^\d{2}\/\d{2}$/.test(v); this.classList.toggle('border-error', !isValid &amp;&amp; v.length &gt; 0); this.classList.toggle('border-primary-container', isValid);">
</div>
<!-- CVV -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-1" for="cvv">CVV</label>
<div class="relative flex items-center">
<input class="block w-full pl-3 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm h-touch-target-min text-center" id="cvv" inputmode="numeric" maxlength="4" placeholder="123" type="tel" oninput="this.value = this.value.replace(/\D/g, ''); const isValid = this.value.length &gt;= 3; this.classList.toggle('border-error', !isValid &amp;&amp; this.value.length &gt; 0); this.classList.toggle('border-primary-container', isValid);">
<div class="absolute right-0 pr-3 flex items-center pointer-events-none text-primary-container">
<span class="material-symbols-outlined text-[18px]" data-icon="security" data-weight="fill">security</span>
</div>
</div>
</div>
</div>
<!-- Cardholder Name -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-1" for="cardName">Cardholder Name</label>
<div class="relative flex items-center">
<div class="absolute left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<input autocomplete="cc-name" class="block w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors shadow-sm h-touch-target-min uppercase" id="cardName" placeholder="Name on card" type="text">
</div>
</div>
<!-- Security Footer -->
<div class="flex items-center justify-center space-x-2 pt-sm opacity-70">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="shield_lock" data-weight="fill">shield_lock</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Your card details are stored securely.</span>
</div>
</form>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant px-margin-mobile py-md pb-safe z-40 flex items-center justify-center">
<div class="max-w-md w-full mx-auto">
<button class="w-full h-[56px] bg-[#0052cc] hover:bg-primary text-white rounded-lg font-button-text text-button-text flex items-center justify-center shadow-[0_4px_12px_0_rgba(0,82,204,0.2)] active:scale-[0.98] transition-transform duration-200 opacity-60" type="button" disabled="true">
                Save Card
            </button>
</div>
</div>
<script>
        // Simple input formatting and preview updating logic
        document.addEventListener('DOMContentLoaded', () => {
            const cardNumberInput = document.getElementById('cardNumber');
            const expiryInput = document.getElementById('expiryDate');
            const nameInput = document.getElementById('cardName');
            
            const numberDisplay = document.getElementById('card-number-display');
            const expiryDisplay = document.getElementById('card-expiry-display');
            const nameDisplay = document.getElementById('card-name-display');

            // Format Card Number
            cardNumberInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                let formattedValue = '';
                for (let i = 0; i < value.length; i++) {
                    if (i > 0 && i % 4 === 0) formattedValue += ' ';
                    formattedValue += value[i];
                }
                e.target.value = formattedValue;
                
                // Update display
                let displayStr = formattedValue || '•••• •••• •••• ••••';
                // Pad with dots if incomplete
                if (value.length < 16 && value.length > 0) {
                     const remaining = 16 - value.length;
                     let dots = '';
                     for(let i=0; i<remaining; i++){
                         if((value.length + i) % 4 === 0 && (value.length + i) > 0) dots += ' ';
                         dots += '•';
                     }
                     displayStr += dots;
                }
                numberDisplay.textContent = displayStr;
            });

            // Format Expiry
            expiryInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length >= 2) {
                    value = value.substring(0, 2) + '/' + value.substring(2, 4);
                }
                e.target.value = value;
                expiryDisplay.textContent = value || 'MM/YY';
            });

            // Update Name
            nameInput.addEventListener('input', function(e) {
                const val = e.target.value.toUpperCase();
                nameDisplay.textContent = val || 'JOHN DOE';
            });
        });
    </script>


</body></html>
