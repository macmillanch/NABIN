<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parcel Delivery Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#c4d2ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#3b475b",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#101c2d",
                        "inverse-on-surface": "#f0f0fb",
                        "surface-tint": "#0c56d0",
                        "on-primary-fixed": "#001848",
                        "surface-dim": "#d9d9e4",
                        "inverse-surface": "#2e3038",
                        "outline-variant": "#c3c6d6",
                        "tertiary-fixed-dim": "#ffb59b",
                        "primary": "#003d9b",
                        "on-error-container": "#93000a",
                        "on-surface": "#191b23",
                        "on-tertiary-fixed-variant": "#812800",
                        "primary-fixed": "#dae2ff",
                        "surface-container-low": "#f3f3fd",
                        "surface-container-highest": "#e1e2ec",
                        "on-tertiary-container": "#ffc6b2",
                        "on-surface-variant": "#434654",
                        "secondary": "#535f73",
                        "surface-variant": "#e1e2ec",
                        "primary-container": "#0052cc",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#576377",
                        "on-tertiary-fixed": "#380d00",
                        "on-background": "#191b23",
                        "surface-bright": "#faf8ff",
                        "outline": "#737685",
                        "background": "#faf8ff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-container-high": "#e7e7f2",
                        "on-tertiary": "#ffffff",
                        "surface": "#faf8ff",
                        "tertiary": "#7b2600",
                        "secondary-fixed-dim": "#bbc7de",
                        "tertiary-container": "#a33500",
                        "on-primary-fixed-variant": "#0040a2",
                        "primary-fixed-dim": "#b2c5ff",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d4e0f8",
                        "inverse-primary": "#b2c5ff",
                        "surface-container": "#ededf8",
                        "secondary-fixed": "#d7e3fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "base": "4px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "button-text": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .parcel-option-checked {
            border-color: #003d9b !important;
            background-color: #dae2ff !important;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Header Section (Focused View - No Shared Nav) -->
<header class="flex items-center bg-surface p-md pb-sm justify-between border-b border-surface-variant">
<div class="text-on-surface flex size-12 shrink-0 items-center cursor-pointer" data-icon="arrow_back">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-on-surface text-headline-md flex-1 text-center pr-12">Delivery Details</h2>
</header>
<main class="flex-1 overflow-y-auto px-margin-mobile py-lg max-w-2xl mx-auto w-full">
<!-- Map Preview Section -->
<div class="rounded-xl overflow-hidden mb-lg h-40 relative group">
<div class="w-full h-full bg-cover bg-center" data-alt="A clean, minimalist digital map interface showing a delivery route in a modern urban city. The map features a soft blue and grey color scheme with a prominent blue line connecting two points. The aesthetic is professional, high-tech, and fits a premium logistics application with clear, legible typography." data-location="London" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAEhfWmseE3ZC0kFvEGWFNchzy1jomiEOHNJK7XU_-_isALLq3NSvBc_jdHpgWopQqLt45qzoeUWROH0hysHu9A8nbTkUeQp-YGnyQYLoE0-Mm42SRThpRiu86wIk1oX5mScL93zSGAJDdcdvE0LfiELLDm4ycu5RCsy6Xhtaehnm5eHERGY8Z7VHOYsGrrKdtC_kKGk7aWj2ha8ehYaQAKlBqYhHoUkSMmEKaCP_3DcOMlqVI83-jEFA')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent flex items-end p-md">
<span class="text-white text-body-sm font-medium">Estimated Distance: 12.4 km</span>
</div>
</div>
<!-- Locations Section (Shared Component logic adapted for Theme) -->
<section class="space-y-md mb-xl">
<h3 class="text-on-surface text-headline-md">Route</h3>
<div class="space-y-sm">
<label class="flex flex-col">
<p class="text-on-surface-variant text-body-sm font-medium pb-xs">Pickup Location</p>
<div class="flex w-full items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 rounded-lg text-on-surface focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-outline-variant bg-surface-container-lowest h-14 p-md rounded-r-none border-r-0 text-body-lg" readonly="" value="221B Baker St, London"/>
<div class="text-primary flex border border-outline-variant bg-surface-container-lowest items-center justify-center pr-md rounded-r-lg border-l-0" data-icon="location_on">
<span class="material-symbols-outlined">location_on</span>
</div>
</div>
</label>
<label class="flex flex-col">
<p class="text-on-surface-variant text-body-sm font-medium pb-xs">Delivery Location</p>
<div class="flex w-full items-stretch rounded-lg shadow-sm">
<input class="form-input flex w-full min-w-0 flex-1 rounded-lg text-on-surface focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-outline-variant bg-surface-container-lowest h-14 p-md rounded-r-none border-r-0 text-body-lg" placeholder="Enter destination address" value="10 Downing Street, London"/>
<div class="text-primary flex border border-outline-variant bg-surface-container-lowest items-center justify-center pr-md rounded-r-lg border-l-0" data-icon="map">
<span class="material-symbols-outlined">map</span>
</div>
</div>
</label>
</div>
</section>
<!-- Parcel Type Section -->
<section class="mb-xl">
<h3 class="text-on-surface text-headline-md mb-md">Parcel Type</h3>
<div class="grid grid-cols-3 gap-sm">
<!-- Document -->
<button class="parcel-type-btn flex flex-col items-center justify-center p-md border-2 border-outline-variant rounded-xl bg-surface-container-low transition-all" id="parcel-doc" onclick="selectParcel('doc')">
<div class="p-sm text-secondary" data-icon="description">
<span class="material-symbols-outlined" style="font-size: 32px;">description</span>
</div>
<span class="text-label-md text-on-surface">Document</span>
</button>
<!-- Small Box -->
<button class="parcel-type-btn parcel-option-checked flex flex-col items-center justify-center p-md border-2 border-primary rounded-xl bg-primary-fixed transition-all" id="parcel-small" onclick="selectParcel('small')">
<div class="p-sm text-primary" data-icon="package_2">
<span class="material-symbols-outlined" style="font-size: 32px;">package_2</span>
</div>
<span class="text-label-md text-on-surface">Small Box</span>
</button>
<!-- Large Box -->
<button class="parcel-type-btn flex flex-col items-center justify-center p-md border-2 border-outline-variant rounded-xl bg-surface-container-low transition-all" id="parcel-large" onclick="selectParcel('large')">
<div class="p-sm text-secondary" data-icon="inventory_2">
<span class="material-symbols-outlined" style="font-size: 32px;">inventory_2</span>
</div>
<span class="text-label-md text-on-surface">Large Box</span>
</button>
</div>
</section>
<!-- Parcel Weight Section -->
<section class="mb-xl">
<div class="flex justify-between items-center mb-md">
<h3 class="text-on-surface text-headline-md">Parcel Weight</h3>
<span class="text-primary font-bold text-headline-md" id="weight-display">2.5 kg</span>
</div>
<div class="px-xs">
<input class="w-full h-2 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" id="weight-slider" max="20" min="0.1" oninput="document.getElementById('weight-display').innerText = this.value + ' kg'" step="0.1" type="range" value="2.5"/>
<div class="flex justify-between text-on-surface-variant text-label-md mt-sm">
<span>0.1 kg</span>
<span>10 kg</span>
<span>20 kg</span>
</div>
</div>
</section>
<!-- Special Instructions Section -->
<section class="mb-xl">
<h3 class="text-on-surface text-headline-md mb-md">Special Instructions</h3>
<textarea class="form-textarea w-full rounded-xl border-outline-variant bg-surface-container-lowest text-on-surface p-md focus:ring-2 focus:ring-primary/20 focus:border-primary text-body-lg min-h-[120px]" placeholder="E.g. Ring the doorbell, leave at front desk, fragile items..."></textarea>
</section>
</main>
<!-- Footer Action -->
<footer class="p-margin-mobile bg-surface border-t border-surface-variant sticky bottom-0">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full bg-primary text-on-primary h-touch-target-min rounded-full text-button-text hover:bg-primary-container transition-colors flex items-center justify-center gap-sm">
<span>Proceed to Fare Estimate</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<script>
        function selectParcel(id) {
            // Reset all buttons
            document.querySelectorAll('.parcel-type-btn').forEach(btn => {
                btn.classList.remove('parcel-option-checked');
                btn.classList.add('border-outline-variant', 'bg-surface-container-low');
                btn.classList.remove('border-primary', 'bg-primary-fixed');
                btn.querySelector('div').classList.replace('text-primary', 'text-secondary');
            });
            
            // Highlight selected
            const selected = document.getElementById('parcel-' + id);
            selected.classList.add('parcel-option-checked');
            selected.classList.remove('border-outline-variant', 'bg-surface-container-low');
            selected.classList.add('border-primary', 'bg-primary-fixed');
            selected.querySelector('div').classList.replace('text-secondary', 'text-primary');
        }

        // Add some subtle click feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function() {
                this.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
