<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* Hide scrollbar for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface h-screen w-full flex flex-col font-body-lg antialiased">
<!-- Header (Contextual Sub-page adaptation of TopAppBar) -->
<header class="flex justify-between items-center h-14 px-margin-mobile w-full bg-surface sticky top-0 z-50 pt-safe shadow-[0_1px_3px_0_rgba(0,0,0,0.05)]">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min -ml-2 text-on-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex-1 flex items-center space-x-3 ml-2">
<div class="relative w-10 h-10 rounded-full overflow-hidden bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A close-up, highly professional studio portrait of a friendly delivery rider named Marcus, wearing a clean, modern high-visibility jacket with subtle blue accents against a bright white background. Soft, natural lighting highlights his approachability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeV9EBtzveqf0b8AosYFAg4MlCUs621KVCVqGcdpDazrxtmYo7CUtYpIG-cnTvYT1V7lTlfn2Z-iJM_wtIsQE12Rr9pSnjj_Y4FrG4ApocMnowKcapBQ2Y7DRdNaSEn3QyWfMcpafLt_Mu24sDttH3NeI31PVEsxOSMCIzPyF_FrDNx3mLnIWW1zJA5ov89yZUw2R8xCqB9mxuA17Muxt1GL8s5AgzQrMgcV1LXKgPeNrYHBJEe8RM8w"/>
<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-surface rounded-full"></div>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface leading-tight">Marcus T.</span>
<span class="font-body-sm text-body-sm text-secondary text-[12px]">Rider • ETA 5 min</span>
</div>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-secondary-container text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">call</span>
</button>
</header>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto no-scrollbar p-margin-mobile flex flex-col space-y-md bg-background pb-20" id="chat-container">
<!-- System Message / Timestamp -->
<div class="flex justify-center my-2">
<span class="bg-surface-variant text-on-surface-variant font-label-md text-label-md px-3 py-1 rounded-full uppercase tracking-wider text-[10px]">Today, 12:42 PM</span>
</div>
<!-- Rider Message (Left) -->
<div class="flex w-full">
<div class="max-w-[85%] bg-surface-container text-on-surface rounded-2xl rounded-tl-sm p-3 shadow-sm">
<p class="font-body-lg text-body-lg text-[15px]">I have picked up your order and I am on my way!</p>
<div class="flex justify-end mt-1">
<span class="font-body-sm text-body-sm text-secondary text-[11px]">12:42 PM</span>
</div>
</div>
</div>
<!-- Customer Message (Right) -->
<div class="flex w-full justify-end">
<div class="max-w-[85%] bg-primary-container text-on-primary-container rounded-2xl rounded-tr-sm p-3 shadow-sm">
<p class="font-body-lg text-body-lg text-[15px]">Great, thanks! Please leave it at the front door.</p>
<div class="flex justify-end items-center mt-1 space-x-1">
<span class="font-body-sm text-body-sm text-on-primary-container opacity-70 text-[11px]">12:45 PM</span>
<span class="material-symbols-outlined text-[14px] text-on-primary-container opacity-70">done_all</span>
</div>
</div>
</div>
<div class="flex w-full">
<div class="max-w-[85%] bg-surface-container text-on-surface rounded-2xl rounded-tl-sm p-3 shadow-sm">
<p class="font-body-lg text-body-lg text-[15px]">I'm almost at your location!</p>
<div class="flex justify-end mt-1">
<span class="font-body-sm text-body-sm text-secondary text-[11px]">12:47 PM</span>
</div>
</div>
</div></main>
<!-- Input Bar -->
<div class="bg-surface border-t border-outline-variant p-2 px-margin-mobile pb-safe fixed bottom-0 w-full z-40">
<div class="flex items-end space-x-2">
<button class="flex-shrink-0 flex items-center justify-center w-10 h-10 text-secondary active:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">add_circle</span>
</button>
<div class="flex-1 bg-surface-container rounded-3xl min-h-[44px] flex items-center px-4 py-1 border border-transparent focus-within:border-outline-variant transition-colors">
<textarea class="w-full bg-transparent border-none outline-none resize-none font-body-lg text-body-lg text-on-surface placeholder:text-secondary py-2 max-h-[100px] no-scrollbar" placeholder="Type a message..." rows="1" style="line-height: 1.2;"></textarea>
</div>
<button class="flex-shrink-0 flex items-center justify-center w-11 h-11 bg-primary text-on-primary rounded-full active:scale-95 transition-transform shadow-md">
<span class="material-symbols-outlined text-[20px]" style="margin-left: 2px;">send</span>
</button>
</div>
</div>
<script>
        // Simple script to ensure chat stays scrolled to bottom
        document.addEventListener("DOMContentLoaded", () => {
            const chatContainer = document.getElementById('chat-container');
            if (chatContainer) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        });
    </script>
