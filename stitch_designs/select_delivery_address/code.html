<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Select Delivery Address - NABIN</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dae2ff",
                        "on-secondary-container": "#576377",
                        "on-tertiary-fixed-variant": "#812800",
                        "surface-container-low": "#f3f3fd",
                        "surface-container-highest": "#e1e2ec",
                        "surface-dim": "#d9d9e4",
                        "on-background": "#191b23",
                        "primary-fixed-dim": "#b2c5ff",
                        "inverse-on-surface": "#f0f0fb",
                        "tertiary-fixed-dim": "#ffb59b",
                        "on-primary-container": "#c4d2ff",
                        "on-surface": "#191b23",
                        "on-secondary": "#ffffff",
                        "primary": "#003d9b",
                        "on-surface-variant": "#434654",
                        "on-tertiary-fixed": "#380d00",
                        "secondary-container": "#d4e0f8",
                        "secondary": "#535f73",
                        "on-tertiary-container": "#ffc6b2",
                        "error-container": "#ffdad6",
                        "surface": "#faf8ff",
                        "on-error": "#ffffff",
                        "surface-bright": "#faf8ff",
                        "outline-variant": "#c3c6d6",
                        "on-secondary-fixed": "#101c2d",
                        "on-primary-fixed-variant": "#0040a2",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdbcf",
                        "secondary-fixed": "#d7e3fb",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2e3038",
                        "background": "#faf8ff",
                        "on-primary-fixed": "#001848",
                        "surface-variant": "#e1e2ec",
                        "on-secondary-fixed-variant": "#3b475b",
                        "outline": "#737685",
                        "surface-container": "#ededf8",
                        "surface-tint": "#0c56d0",
                        "surface-container-high": "#e7e7f2",
                        "tertiary-container": "#a33500",
                        "inverse-primary": "#b2c5ff",
                        "tertiary": "#7b2600",
                        "secondary-fixed-dim": "#bbc7de",
                        "primary-container": "#0052cc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "gutter-mobile": "12px",
                        "touch-target-min": "48px",
                        "md": "16px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "button-text": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "button-text": ["16px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:hidden">
<!-- TopAppBar (Destination/Task) -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim flat no shadows flex justify-between items-center h-14 px-margin-mobile w-full">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">Select Address</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-1 flex flex-col px-margin-mobile pt-sm pb-xl gap-md">
<!-- Search Bar -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="search">search</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface h-touch-target-min transition-colors" placeholder="Enter a new address" type="text"/>
</div>
<!-- Current Location & Map Actions -->
<div class="flex flex-col gap-sm bg-surface-container-lowest rounded-xl p-sm shadow-[0_4px_12px_0_rgba(0,0,0,0.05)] border border-outline-variant/30">
<button class="flex items-center gap-md p-sm hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.98]">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-secondary-container text-primary">
<span class="material-symbols-outlined" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
<div class="flex flex-col items-start">
<span class="font-button-text text-button-text text-primary">Use Current Location</span>
<span class="font-body-sm text-body-sm text-secondary">Enable GPS for precise delivery</span>
</div>
</button>
<div class="h-[1px] w-full bg-outline-variant/30 mx-auto"></div>
<button class="flex items-center gap-md p-sm hover:bg-surface-container-low transition-colors rounded-lg active:scale-[0.98]">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="map">map</span>
</div>
<div class="flex flex-col items-start">
<span class="font-button-text text-button-text text-on-surface">Set on Map</span>
<span class="font-body-sm text-body-sm text-secondary">Pinpoint your exact location</span>
</div>
</button>
</div>
<!-- Saved Places -->
<section class="flex flex-col gap-sm mt-sm">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider px-xs">Saved Places</h2>
<div class="flex flex-col bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_0_rgba(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden">
<!-- Home -->
<button class="flex items-center gap-md p-md hover:bg-surface-container-low transition-colors active:bg-surface-container-high w-full text-left">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant shrink-0">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<div class="flex flex-col flex-1 overflow-hidden">
<span class="font-button-text text-button-text text-on-surface truncate">Home</span>
<span class="font-body-sm text-body-sm text-secondary truncate">123 Maple St, Apt 4B</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="more_vert">more_vert</span>
</button>
<div class="h-[1px] w-[calc(100%-4rem)] bg-outline-variant/30 ml-auto"></div>
<!-- Work -->
<button class="flex items-center gap-md p-md hover:bg-surface-container-low transition-colors active:bg-surface-container-high w-full text-left">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant shrink-0">
<span class="material-symbols-outlined" data-icon="work" data-weight="fill" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<div class="flex flex-col flex-1 overflow-hidden">
<span class="font-button-text text-button-text text-on-surface truncate">Work</span>
<span class="font-body-sm text-body-sm text-secondary truncate">456 Oak Ave, Floor 12</span>
</div>
<span class="material-symbols-outlined text-outline-variant" data-icon="more_vert">more_vert</span>
</button>
</div>
</section>
<!-- Recent Addresses -->
<section class="flex flex-col gap-sm mt-sm">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider px-xs">Recent</h2>
<div class="flex flex-col bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_0_rgba(0,0,0,0.05)] border border-outline-variant/30 overflow-hidden">
<button class="flex items-center gap-md p-md hover:bg-surface-container-low transition-colors active:bg-surface-container-high w-full text-left">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-lowest text-outline shrink-0">
<span class="material-symbols-outlined" data-icon="history">history</span>
</div>
<div class="flex flex-col flex-1 overflow-hidden">
<span class="font-body-lg text-body-lg text-on-surface truncate">789 Pine Lane</span>
<span class="font-body-sm text-body-sm text-secondary truncate">Cityville, ST 12345</span>
</div>
</button>
<div class="h-[1px] w-[calc(100%-4rem)] bg-outline-variant/30 ml-auto"></div>
<button class="flex items-center gap-md p-md hover:bg-surface-container-low transition-colors active:bg-surface-container-high w-full text-left">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-lowest text-outline shrink-0">
<span class="material-symbols-outlined" data-icon="history">history</span>
</div>
<div class="flex flex-col flex-1 overflow-hidden">
<span class="font-body-lg text-body-lg text-on-surface truncate">101 Cedar Blvd</span>
<span class="font-body-sm text-body-sm text-secondary truncate">Townsburg, ST 67890</span>
</div>
</button>
</div>
</section>
</main>
<!-- Navigation omitted due to transactional task intent (Select Address) -->
</body></html>
