<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>NABIN Driver - Trip Payment & Rating</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body class="bg-slate-900 text-slate-900 h-screen w-full flex items-center justify-center p-4 font-sans relative">

<div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl border border-slate-200 flex flex-col gap-4 text-center">
  
  <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 mx-auto flex items-center justify-center">
    <span class="material-symbols-outlined text-4xl">check_circle</span>
  </div>

  <div>
    <span class="text-xs font-black text-emerald-600 uppercase tracking-wider">Passenger Ride Completed</span>
    <div class="text-3xl font-black text-slate-900 mt-1">₹85.00</div>
    <p class="text-xs text-slate-500 mt-1">Credited directly to your NABIN Driver Wallet</p>
  </div>

  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 text-xs space-y-1.5 text-left">
    <div class="flex justify-between text-slate-600">
      <span>Gross Customer Fare:</span>
      <b class="text-slate-800">₹85.00</b>
    </div>
    <div class="flex justify-between text-rose-600">
      <span>NABIN Commission (10%):</span>
      <b>-₹8.50</b>
    </div>
    <div class="border-t border-slate-200 pt-1 flex justify-between font-black text-emerald-600">
      <span>Net Driver Earning:</span>
      <b>₹76.50</b>
    </div>
  </div>

  <!-- Rate Passenger -->
  <div>
    <div class="text-xs font-extrabold text-slate-800 mb-2">Rate Passenger (Rahul Sharma)</div>
    <div class="flex justify-center gap-2 text-2xl text-amber-400 cursor-pointer">
      <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
    </div>
  </div>

  <a href="../driver_home_console/code.html" class="w-full h-13 py-3.5 bg-[#003D9B] hover:bg-[#00296d] text-white font-black rounded-2xl text-sm transition text-center shadow-lg shadow-blue-900/20">
    Done & Return to Console
  </a>
</div>

</body>
</html>
