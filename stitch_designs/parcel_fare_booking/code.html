<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Parcel Delivery - NABIN</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">

                extend: {

                        "primary-container": "#0052cc",
                        "outline": "#737685",
                        "error-container": "#ffdad6",
                        "on-surface": "#191b23",
                        "on-secondary-fixed-variant": "#3b475b",
                        "inverse-primary": "#b2c5ff",
                        "surface-bright": "#faf8ff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e1e2ec",
                        "on-primary-fixed-variant": "#0040a2",
                        "on-error-container": "#93000a",
                        "secondary": "#535f73",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#001848",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#812800",

                    "borderRadius": {

                    "spacing": {

<style>
        /* Ambient shadows and depth levels */
        .elevation-0 { background-color: #F4F5F7; }
        .elevation-1 { box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.05); }
        .elevation-2 { box-shadow: 0 8px 20px 0 rgba(0, 0, 0, 0.12); }
        
        /* Map specific styles */
        .map-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50vh;
            z-index: 0;
            background-color: #e5e5e5; /* Fallback for map */
        }
        
        .bottom-sheet {
            position: relative;
            z-index: 10;
            margin-top: 40vh;
            min-height: 60vh;
            background-color: #faf8ff;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .swipe-handle {
            width: 40px;
            height: 4px;
            background-color: #DFE1E6;
            border-radius: 9999px;
            margin: 12px auto 16px;
        }

        /* Prevent body scroll when sheet is active */
        body { overscroll-behavior-y: none; background-color: #faf8ff; }
    </style>
</head>
<body class="bg-background text-on-background font-body-sm overflow-x-hidden">
<!-- Top App Bar (Overlaid on Map) -->
<header class="w-full sticky top-0 z-50 flex justify-between items-center h-14 px-margin-mobile bg-transparent">
<button aria-label="Go Back" class="w-[48px] h-[48px] flex items-center justify-center bg-surface rounded-full elevation-1 active:scale-95 duration-100 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight hidden">NABIN</div>
<div class="w-[48px] h-[48px]"></div> <!-- Spacer to balance -->
</header>
<!-- Map Area -->
<div class="map-container overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="A clean, modern top-down 2D map view showing a route between two points in a city. The map style is minimal, using light greys and soft whites for roads and blocks, with a bright, primary blue line connecting a pickup pin and a delivery pin. The overall aesthetic is functional, logistics-focused, and highly legible, suitable for a light-mode mobile application." data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGZGV59kEebAm0dVhz7zuBmeweCc05NvBEE5Ci8AhGFnYkvgNGVc0McHwBTvtEk1PGKhL1gXdn4ftl7g9hpGqV40Bn0pXIFpz11t7BgiJP5SoXTqYuQeFQcEyeotNyeHEegc-ZIItb_zrpXyXSzeYvezwzpvAj1v9uasKRj4swPe56ykaVY5xsBJbkNhwcTGvN_g-qH_-Fh26CLB-BP412W7JuQo9ivc_ZMGCHwQzE7c236ODGGHGJkQ">
<!-- Mock Map Overlays (Pins & Route) -->
<div class="absolute inset-0 z-10 flex flex-col justify-center items-center pointer-events-none">
<!-- These are abstract representations overlaying the generated map image -->
</div>
</div>
<!-- Bottom Sheet Content -->
<main class="bottom-sheet elevation-2 px-margin-mobile flex flex-col shadow-[0_-8px_20px_0_rgba(0,0,0,0.12)]">
<div class="swipe-handle"></div>
<!-- Locations Card -->
<div class="bg-surface-container-lowest rounded-xl p-md elevation-1 mb-md relative">
<div class="flex items-start mb-sm">
<div class="w-6 h-6 flex items-center justify-center mr-sm mt-0.5">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
</div>
<div class="flex-1 pb-sm border-b border-outline-variant">
<p class="font-label-md text-label-md text-secondary mb-xs uppercase">Pickup</p>
<p class="font-body-lg text-body-lg text-on-surface truncate">123 Market Street, Suite 400</p>
</div>
</div>
<!-- Dotted line connecting origin and destination -->
<div class="absolute left-[35px] top-[40px] bottom-[48px] w-0.5 border-l-2 border-dotted border-outline-variant z-0"></div>
<div class="flex items-start pt-sm">
<div class="w-6 h-6 flex items-center justify-center mr-sm mt-0.5">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex-1">
<p class="font-label-md text-label-md text-secondary mb-xs uppercase">Delivery</p>
<p class="font-body-lg text-body-lg text-on-surface truncate">890 Valencia St, Apt 2B</p>
</div>
</div>
</div>
<!-- Details Grid -->
<div class="flex flex-col gap-sm mb-md">
  <!-- Motorbike (Selected) -->
  <div class="bg-surface-container-lowest rounded-xl p-md elevation-1 border-2 border-primary flex items-center justify-between">
    <div class="flex items-center">
      <div class="w-10 h-10 bg-primary-container rounded-full flex items-center justify-center mr-md">
        <span class="material-symbols-outlined text-on-primary">motorcycle</span>
      </div>
      <div>
        <p class="font-button-text text-on-surface">Motorbike</p>
        <p class="text-body-sm text-secondary">Standard</p>
      </div>
    </div>
    <div class="text-right">
      <p class="font-headline-md text-primary">$12.00</p>
      <p class="text-label-md text-secondary">15 min</p>
    </div>
  </div>
  <!-- Eco-Car -->
  <div class="bg-surface-container-lowest rounded-xl p-md elevation-1 border border-outline-variant flex items-center justify-between active:scale-[0.98] transition-transform">
    <div class="flex items-center">
      <div class="w-10 h-10 bg-surface-container-highest rounded-full flex items-center justify-center mr-md">
        <span class="material-symbols-outlined text-on-surface-variant">eco</span>
      </div>
      <div>
        <p class="font-button-text text-on-surface">Eco-Car</p>
        <p class="text-body-sm text-secondary">Enclosed</p>
      </div>
    </div>
    <div class="text-right">
      <p class="font-headline-md text-on-surface">$18.50</p>
      <p class="text-label-md text-secondary">22 min</p>
    </div>
  </div>
  <!-- Van -->
  <div class="bg-surface-container-lowest rounded-xl p-md elevation-1 border border-outline-variant flex items-center justify-between active:scale-[0.98] transition-transform">
    <div class="flex items-center">
      <div class="w-10 h-10 bg-surface-container-highest rounded-full flex items-center justify-center mr-md">
        <span class="material-symbols-outlined text-on-surface-variant">local_shipping</span>
      </div>
      <div>
        <p class="font-button-text text-on-surface">Van</p>
        <p class="text-body-sm text-secondary">Large capacity</p>
      </div>
    </div>
    <div class="text-right">
      <p class="font-headline-md text-on-surface">$25.00</p>
      <p class="text-label-md text-secondary">30 min</p>
    </div>
  </div>
</div>
<!-- Parcel Details Input -->
<div class="bg-surface-container-lowest rounded-xl p-md elevation-1 mb-md border border-outline-variant focus-within:border-primary transition-colors">
<label class="flex items-center mb-xs" for="parcel-notes">
<span class="material-symbols-outlined text-secondary mr-2" style="font-size: 20px;">inventory_2</span>
<span class="font-label-md text-label-md text-on-surface">Parcel Details (Optional)</span>
</label>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-body-lg text-body-lg text-on-surface placeholder-secondary" id="parcel-notes" placeholder="e.g. Small box, fragile" type="text">
</div>
<!-- Payment Method Selector -->
<div class="mt-auto mb-xl">
<div class="flex justify-between items-center mb-sm">
<h3 class="font-label-md text-label-md text-secondary uppercase">Payment Method</h3>
<button class="text-primary font-body-sm text-body-sm hover:underline">Change</button>
</div>
<button class="w-full bg-surface-container-lowest rounded-xl p-md elevation-1 flex items-center justify-between active:scale-[0.98] transition-transform">
<div class="flex items-center">
<div class="w-[40px] h-[30px] bg-primary-container rounded flex items-center justify-center mr-sm">
<span class="material-symbols-outlined text-on-primary" style="font-size: 20px;">credit_card</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Visa ending in 4242</span>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</button>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[56px] bg-primary-container text-on-primary font-button-text text-button-text rounded-lg flex items-center justify-center shadow-md active:scale-95 transition-transform mb-md">Book Parcel Delivery • $12.00</button>
</main>
<!-- Suppress Navigation Shells for transactional/task-focused screen as per instructions -->


</body></html>
