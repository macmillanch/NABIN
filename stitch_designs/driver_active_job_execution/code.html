<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>NABIN Driver - Active Job Execution</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#003d9b",
                        "primary": "#00296d",
                        "secondary": "#006e2a",
                        "brand-green": "#00D632",
                        "brand-blue": "#003d9b"
                    }
                }
            }
        }
</script>
</head>
<body class="bg-slate-900 text-slate-900 h-screen w-full overflow-hidden relative font-sans">

<!-- Full-screen GPS Navigation Map Simulation -->
<div class="absolute inset-0 w-full h-full z-0">
  <img alt="Active Navigation Map" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7ZMqDKbudMTjfEwU1vOZvTF6sN05ss-Qq0Btf85I03ylGVLvBuB7tzwZVhEIj2lpFLqYT6srdNCO9FJkpkkACIbfR5G9kvkEO-RbS6htvyrA7rCAs39gV1K-8EpE0KZompZyhnNT-RHG1uD2ASmxZzTeNqcI0-W5teFlHebYSBodgkmqPPnrNyTnDPvHV3jnNTrqRmF1QGvQTiC8ieRoal8NoYC8mZjE4iegoz9tFCeuGiTjxraxiPdYLuM-0jw3XE-eCFLp73M-h"/>
</div>

<!-- Top Turn-by-Turn GPS Navigation Banner -->
<div class="relative z-30 fixed top-3 left-3 right-3">
  <div class="bg-[#00296d] text-white rounded-2xl p-4 shadow-2xl flex items-center justify-between border border-blue-900">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-[#003D9B] flex items-center justify-center text-white">
        <span class="material-symbols-outlined text-3xl">turn_right</span>
      </div>
      <div>
        <div class="text-base font-black leading-tight">In 350 meters</div>
        <div class="text-xs text-blue-200 font-semibold">Turn right onto Mall Road</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-sm font-black text-emerald-400">4 mins</div>
      <div class="text-[10px] text-blue-300">1.2 km left</div>
    </div>
  </div>
</div>

<!-- Floating Action Buttons (VoIP Call & Emergency SOS) -->
<div class="absolute right-4 bottom-72 z-30 flex flex-col gap-2">
  <button class="w-12 h-12 rounded-2xl bg-emerald-500 text-slate-950 flex items-center justify-center shadow-xl font-bold">
    <span class="material-symbols-outlined text-2xl">call</span>
  </button>
  <button class="w-12 h-12 rounded-2xl bg-rose-600 text-white flex items-center justify-center shadow-xl font-bold">
    <span class="material-symbols-outlined text-2xl">sos</span>
  </button>
</div>

<!-- Bottom Floating Stage Execution Control Sheet -->
<div class="absolute bottom-4 left-3 right-3 z-30">
  <div class="bg-white rounded-3xl p-4 shadow-2xl border border-slate-200 flex flex-col gap-3">
    
    <div class="flex items-center justify-between">
      <span class="px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 text-[10px] font-black uppercase tracking-wider">
        STAGE 2: VERIFY PASSENGER START OTP
      </span>
      <span class="text-xs font-black text-slate-900">₹85.00 Guaranteed</span>
    </div>

    <div>
      <div class="text-sm font-black text-slate-900 leading-snug">Civil Lines Metro Gate 2</div>
      <div class="text-xs text-slate-500 font-medium">Customer: Rahul Sharma (+91 98110 29381)</div>
    </div>

    <!-- OTP Input Area -->
    <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200">
      <div class="text-xs font-bold text-slate-700 mb-1.5">
        Enter 4-digit Passenger OTP (7729):
      </div>
      <div class="flex items-center gap-2">
        <input type="text" maxlength="4" value="7729" class="flex-1 p-2.5 rounded-xl border border-slate-300 font-black text-center text-lg tracking-widest text-blue-800 bg-white outline-none" />
        <a href="../../driver_app.html" class="px-4 py-2.5 bg-emerald-500 text-slate-950 font-black rounded-xl text-xs text-center">
          Verify Code
        </a>
      </div>
    </div>

    <a href="../../driver_app.html" class="w-full h-14 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black rounded-2xl text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20">
      <span>START TRIP & BEGIN NAVIGATION</span>
      <span class="material-symbols-outlined">navigation</span>
    </a>

  </div>
</div>

</body>
</html>
