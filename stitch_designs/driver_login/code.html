<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>NABIN Driver - Phone Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00296d",
            "primary-container": "#003d9b",
            "secondary": "#006e2a",
            "surface": "#fcf9f8",
            "outline": "#747783"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#fcf9f8] text-[#1c1b1b] h-screen w-screen overflow-hidden flex flex-col justify-between p-6 font-sans">
  
  <div>
    <!-- Top Branding -->
    <div class="flex items-center gap-2 mb-8">
      <div class="w-10 h-10 rounded-xl bg-[#003D9B] flex items-center justify-center text-white font-black text-sm">N</div>
      <div>
        <div class="font-black text-sm text-[#00296d] leading-tight">NABIN</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Driver Partner Portal</div>
      </div>
    </div>

    <h2 class="text-2xl font-black text-slate-900 tracking-tight">Enter your mobile number</h2>
    <p class="text-xs text-slate-500 mt-1 mb-6">Enter phone number to access your Bike, Auto or Cab driver console.</p>

    <!-- Phone Input Box -->
    <div class="rounded-2xl border-2 border-slate-200 focus-within:border-[#003D9B] p-3.5 bg-white flex items-center gap-3 shadow-sm transition">
      <div class="flex items-center gap-1.5 pr-3 border-r border-slate-300 text-sm font-black text-slate-800">
        <span class="text-lg">🇮🇳</span>
        <span>+91</span>
      </div>
      <input type="tel" value="9876543210" placeholder="Mobile Number" class="w-full bg-transparent text-base font-extrabold text-slate-900 outline-none tracking-wide" />
    </div>

    <div class="mt-4 flex items-center justify-between">
      <span class="text-xs text-slate-400 font-medium">New partner without KYC?</span>
      <a href="../driver_kyc_compliance/code.html" class="text-xs font-bold text-[#003D9B] hover:underline">
        Register Vehicle (KYC)
      </a>
    </div>
  </div>

  <div class="flex flex-col gap-3">
    <p class="text-[11px] text-center text-slate-400">By continuing, you agree to NABIN Partner T&C and Safety Policies.</p>
    <a href="../driver_otp/code.html" class="w-full h-14 bg-[#003D9B] hover:bg-[#00296d] text-white font-black rounded-2xl text-base flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20 active:scale-[0.98] transition">
      <span>Send Driver OTP</span>
      <span class="material-symbols-outlined">sms</span>
    </a>
  </div>

</body>
</html>
