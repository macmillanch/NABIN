<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <title>NABIN Driver - OTP Verification</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00296d",
            "primary-container": "#003d9b",
            "secondary": "#006e2a",
            "surface": "#fcf9f8",
            "outline": "#747783"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#fcf9f8] text-[#1c1b1b] h-screen w-screen overflow-hidden flex flex-col justify-between p-6 font-sans">
  
  <div>
    <a href="../driver_login/code.html" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-700 mb-6 hover:bg-slate-200 transition">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>

    <h2 class="text-2xl font-black text-slate-900 tracking-tight">Enter Driver OTP</h2>
    <p class="text-xs text-slate-500 mt-1 mb-8">
      Enter 4-digit code sent to <b class="text-slate-800">+91 98765 43210</b>
    </p>

    <!-- OTP Input Boxes -->
    <div class="flex justify-between gap-3 mb-6">
      <input type="text" maxlength="1" value="7" class="w-14 h-16 rounded-2xl border-2 border-[#003D9B] bg-blue-50/40 text-center font-black text-2xl text-[#00296d] outline-none" />
      <input type="text" maxlength="1" value="7" class="w-14 h-16 rounded-2xl border-2 border-[#003D9B] bg-blue-50/40 text-center font-black text-2xl text-[#00296d] outline-none" />
      <input type="text" maxlength="1" value="2" class="w-14 h-16 rounded-2xl border-2 border-[#003D9B] bg-blue-50/40 text-center font-black text-2xl text-[#00296d] outline-none" />
      <input type="text" maxlength="1" value="9" class="w-14 h-16 rounded-2xl border-2 border-[#003D9B] bg-blue-50/40 text-center font-black text-2xl text-[#00296d] outline-none" />
    </div>

    <div class="flex items-center justify-between text-xs">
      <span class="text-emerald-600 font-bold flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">verified</span> Demo Code: 7729
      </span>
      <button class="text-[#003D9B] font-bold">Resend in 24s</button>
    </div>
  </div>

  <a href="../driver_home_console/code.html" class="w-full h-14 bg-[#003D9B] hover:bg-[#00296d] text-white font-black rounded-2xl text-base flex items-center justify-center gap-2 shadow-lg shadow-blue-900/20 active:scale-[0.98] transition">
    <span>Verify & Open Console</span>
    <span class="material-symbols-outlined">login</span>
  </a>

</body>
</html>
