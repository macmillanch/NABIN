<!DOCTYPE html>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full sticky top-0 z-50 bg-surface flex justify-between items-center h-14 px-margin-mobile">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-secondary hover:bg-surface-container-high transition-colors rounded-full -ml-2 active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Add Payment Method</h1>
<div class="w-touch-target-min h-touch-target-min"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-md flex flex-col gap-sm">
<!-- Payment Options List -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_0_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Credit or Debit Card -->
<button class="w-full flex items-center justify-between p-md border-b border-outline-variant hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-100 group text-left">
<div class="flex items-center gap-md">
<div class="flex items-center justify-center w-12 h-12 bg-secondary-container text-on-secondary-container rounded-full group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<div class="flex flex-col">
<span class="font-button-text text-button-text text-on-surface">Credit or Debit Card</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Add Visa, Mastercard, or Amex</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- UPI ID -->
<button class="w-full flex items-center justify-between p-md border-b border-outline-variant hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-100 group text-left">
<div class="flex items-center gap-md">
<div class="flex items-center justify-center w-12 h-12 bg-secondary-container text-on-secondary-container rounded-full group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-button-text text-button-text text-on-surface">UPI ID</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Pay directly from your bank</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Bank Account -->
<button class="w-full flex items-center justify-between p-md border-b border-outline-variant hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-100 group text-left">
<div class="flex items-center gap-md">
<div class="flex items-center justify-center w-12 h-12 bg-secondary-container text-on-secondary-container rounded-full group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-button-text text-button-text text-on-surface">Bank Account</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Direct bank transfer setup</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Digital Wallets -->
<button class="w-full flex items-center justify-between p-md hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-100 group text-left">
<div class="flex items-center gap-md">
<div class="flex items-center justify-center w-12 h-12 bg-secondary-container text-on-secondary-container rounded-full group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="flex flex-col">
<span class="font-button-text text-button-text text-on-surface">Digital Wallets</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Link existing payment wallets</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Info Security Note -->
<div class="mt-lg flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-body-sm text-body-sm">Your payment information is securely encrypted.</span>
</div>
</main>
