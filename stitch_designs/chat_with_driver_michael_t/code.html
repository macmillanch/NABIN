<style>
        /* Hide scrollbar for cleaner look in chat */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>

<body class="bg-surface text-on-surface font-sans antialiased h-screen w-full overflow-hidden flex justify-center">
<!-- Mobile Viewport Container -->
<div class="h-full w-full max-w-md flex flex-col bg-surface relative shadow-[0_0_40px_rgba(0,0,0,0.05)] sm:border-x sm:border-outline-variant">
<!-- Top Header: Sub-page Context -->
<!-- Supressing Bottom Navigation as this is a Task-Focused sub-page (Chat) -->
<header class="flex-none flex justify-between items-center h-14 px-margin-mobile w-full bg-surface-container-lowest sticky top-0 z-50 border-b border-outline-variant shadow-[0_4px_12px_0_rgba(0,0,0,0.02)]">
<!-- Back Action -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-on-surface flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Driver Identity Core -->
<div class="flex flex-1 items-center justify-center overflow-hidden px-2">
<div class="flex flex-col items-center justify-center w-full">
<div class="flex items-center gap-sm">
<img class="w-8 h-8 rounded-full object-cover shadow-sm flex-shrink-0 border border-outline-variant" data-alt="A bright, realistic headshot of a friendly, professional rideshare driver named Michael in his mid-30s. He is wearing a clean, casual grey polo shirt. The lighting is natural, suggesting a sunny day, with a modern, crisp, trustworthy aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA39IrhmSwm5l2K3ZaTFfjwiYI6uuG22X_5YAqspztF7oBpnfvq-fTHuOLzDKF5fsrtAX5Noc5JuM3IZNOAbswzpT1v2HfMfJlAD4IGAgo8TiQ9ACENuoY9tIWmm0UCBuWdCNKblBiX24s6VY9JED7n1FzASfUzODwMD98ChYnHniqMmu0mz5uO4WUbth2T_9Loidc1HLzze4v3O9s02pa8_GSs84h2KqEcFpUU3bGQfId6bs749xsOog"/>
<span class="font-button-text text-button-text text-on-surface truncate">Michael T.</span>
</div>
<span class="font-body-sm text-body-sm text-secondary truncate mt-0.5">Silver Toyota Camry • ABC-1234</span>
</div>
</div>
<!-- Contextual Action -->
<button aria-label="Call Michael" class="w-10 h-10 flex items-center justify-center -mr-2 rounded-full bg-secondary-container text-primary-container hover:bg-surface-container-high transition-colors active:scale-95 flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">call</span>
</button>
</header>
<!-- Chat Canvas Area -->
<main class="flex-1 overflow-y-auto no-scrollbar px-md py-lg flex flex-col bg-surface relative">
<!-- System Status Message -->
<div class="flex justify-center w-full mt-4 mb-auto">
<div class="bg-surface-container border border-outline-variant px-4 py-2 rounded-full flex items-center gap-2 shadow-[0_2px_8px_0_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1; font-size: 16px;">directions_car</span>
<span class="font-label-md text-label-md text-on-surface-variant">Michael is on the way</span>
</div>
</div>
<!-- Spacer to push input to bottom -->
<div class="flex-1 min-h-[40px]"></div>
</main>
<!-- Input Composition Area -->
<footer class="flex-none bg-surface-container-lowest border-t border-outline-variant px-margin-mobile py-sm pb-[max(8px,env(safe-area-inset-bottom))] shadow-[0_-4px_12px_0_rgba(0,0,0,0.05)] w-full z-50">
<div class="flex items-end gap-sm w-full">
<!-- Quick Actions / Attach -->
<button class="h-touch-target-min w-10 flex items-center justify-center rounded-full text-secondary hover:bg-surface-container-low transition-colors flex-shrink-0 mb-[2px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add_circle</span>
</button>
<!-- Text Input Container -->
<div class="flex-1 bg-surface-container-lowest border border-outline-variant rounded-[24px] min-h-[48px] px-4 py-3 flex items-center focus-within:border-primary-container focus-within:border-2 transition-all group">
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 resize-none font-body-lg text-body-lg text-on-surface placeholder:text-secondary max-h-[120px] overflow-y-auto no-scrollbar outline-none" placeholder="Message Michael..." rows="1" style="min-height: 24px;"></textarea>
</div>
<!-- Send Action -->
<button class="h-12 w-12 flex items-center justify-center bg-primary-container text-on-primary rounded-full hover:bg-primary transition-colors active:scale-95 flex-shrink-0 shadow-sm">
<span class="material-symbols-outlined ml-1" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</footer>
</div>
<!-- Script for textarea auto-resize -->
<script>
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() === '') {
                this.style.height = '24px'; // Reset to min height
            }
        });
    </script>
</body></html>
