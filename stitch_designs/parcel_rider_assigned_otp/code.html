<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Pulse animation for rider location */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80% { transform: scale(2); opacity: 0; }
            100% { transform: scale(2); opacity: 0; }
        }
        .rider-pulse::before {
            content: '';
            position: absolute;
            left: -50%;
            top: -50%;
            width: 200%;
            height: 200%;
            background-color: #0052cc;
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>

<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col light">
<!-- Shared Component: TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface-dim flex justify-between items-center h-14 px-margin-mobile text-primary dark:text-primary-fixed-dim font-headline-md text-headline-md flat no shadows">
<button aria-label="Location" class="w-touch-target-min h-touch-target-min flex items-center justify-start hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 rounded-full">

<path d="M 30 70 Q 50 60, 60 40 T 70 20" fill="none" stroke="#0052cc" stroke-dasharray="2 1" stroke-linecap="round" stroke-width="0.8"></path>
</svg>
<!-- Pickup Location Marker -->

<div class="w-1 h-3 bg-primary"></div>
</div>
<!-- Rider Location Marker (Animated) -->
<div class="absolute top-[40%] left-[60%] transform -translate-x-1/2 -translate-y-1/2 drop-shadow-md z-10">
<div class="relative rider-pulse bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center border-[3px] border-surface shadow-[0_4px_12px_0_rgba(0,0,0,0.12)]">
