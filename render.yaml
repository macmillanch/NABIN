# ==============================================================================
# Render Blueprint Specification — NABIN Unified Backend
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. NABIN Production API Web Service (LIVE RAIL TIER)
  # ---------------------------------------------------------------------------
  - type: web
    name: nabin-backend-prod
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Which Supabase project this service may reach. The backend and the migration
      # runner both refuse to start when SUPABASE_URL, DATABASE_URL, or a key's own
      # project claim disagrees with this ref — so production data cannot be reached by
      # a process that names itself something else, and cannot be reached by accident.
      - key: NABIN_ENV
        value: production
      - key: NABIN_SUPABASE_REF
        value: ouxvqmhuyueklnegvmxe
      - key: PORT
        value: 4000
      - key: PAYMENT_MODE
        value: sandbox
      - key: PAYMENT_KEY_ID
        sync: false # Set in Render Dashboard (rzp_live_...)
      - key: PAYMENT_KEY_SECRET
        sync: false # Set in Render Dashboard
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false # Set in Render Dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set in Render Dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set in Render Dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set in Render Dashboard
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard
      - key: DATABASE_URL
        sync: false # Postgres session-pooler string; scripts/migrate.js applies the schema on start
      - key: SUPABASE_POSTGRES_LIVE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_SECRET
        sync: false # Set securely in Render Dashboard

  # ---------------------------------------------------------------------------
  # 2. NABIN Beta Staging Web Service (ISOLATED SANDBOX TIER)
  # ---------------------------------------------------------------------------
  - type: web
    name: nabin-beta-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      # The isolated sandbox tier talks to `nabin-test`, never to the production
      # project. Same refusal as production, in the other direction: a stale
      # production key or URL in this service's secrets stops the boot.
      - key: NABIN_ENV
        value: testing
      - key: NABIN_SUPABASE_REF
        value: ywhxkzmbwppkdemvzlhv
      - key: PORT
        value: 4000
      - key: PAYMENT_MODE
        value: sandbox
      - key: PAYMENT_KEY_ID
        sync: false
      - key: PAYMENT_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_POSTGRES_LIVE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
