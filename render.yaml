# ==============================================================================
# Render Blueprint Specification — NABIN Unified Backend
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. NABIN Production API Web Service (LIVE RAIL TIER)
  # ---------------------------------------------------------------------------
  - type: web
    name: nabin-backend-prod
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PAYMENT_MODE
        value: live
      - key: PAYMENT_KEY_ID
        sync: false # Set in Render Dashboard (rzp_live_...)
      - key: PAYMENT_KEY_SECRET
        sync: false # Set in Render Dashboard
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false # Set in Render Dashboard
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Dashboard
      - key: REDIS_URL
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. NABIN Beta Staging Web Service (ISOLATED SANDBOX TIER)
  # ---------------------------------------------------------------------------
  - type: web
    name: nabin-beta-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PAYMENT_MODE
        value: sandbox
      - key: PAYMENT_KEY_ID
        value: rzp_test_nabin_beta_2026
      - key: PAYMENT_KEY_SECRET
        value: rzp_sec_nabin_beta_test_secret_2026
      - key: PAYMENT_WEBHOOK_SECRET
        value: whsec_nabin_secure_beta_2026
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
