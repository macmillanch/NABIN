name: NABIN Platform CI/CD Pipeline

on:
  push:
    branches: [ develop, main, beta ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BACKEND & INTEGRATION TEST SUITE
  # =========================================================================
  backend-qa:
    name: Backend Node.js & Full Architecture QA Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nabin_admin
          POSTGRES_PASSWORD: NabinSecureDBPassword123!
          POSTGRES_DB: nabin_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Database Migrations
        run: |
          test -f backend/migrations/001_central_schema.sql
          test -f backend/migrations/002_finance_ledger_schema.sql

      - name: Security Vulnerability Scan
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Start NABIN Backend Server (Daemon)
        working-directory: backend
        run: |
          node src/server.js &
          sleep 3

      - name: Execute Full-Platform Automated QA Test Suite (80 Tests)
        working-directory: backend
        run: node test_suite.js

      - name: Execute Persistence & Cold-Restart Verification (12 Tests)
        working-directory: backend
        run: node restart_test.js

      - name: Execute Read-Only Backend Smoke Test Suite
        working-directory: backend
        run: node smoke_test.js

  # =========================================================================
  # 2. FLUTTER MOBILE APP VALIDATION
  # =========================================================================
  flutter-validation:
    name: Flutter Customer, Driver & Merchant App Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Execute Flutter Widget & Flow Test Suite (12 Tests)
        working-directory: mobile
        run: flutter test

  # =========================================================================
  # 3. DOCKER PRODUCTION IMAGE COMPILATION & REGISTRY PUBLISH
  # =========================================================================
  build-container:
    name: Build & Package Production Container Image
    needs: [ backend-qa, flutter-validation ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nabin-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nabin-backend:latest

  # =========================================================================
  # 4. BETA ENVIRONMENT DEPLOYMENT & HEALTH VERIFICATION
  # =========================================================================
  deploy-beta:
    name: Deploy to Isolated Beta Environment
    needs: [ build-container ]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    environment:
      name: beta
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Beta Cluster Deployment Webhook
        env:
          BETA_DEPLOY_WEBHOOK_URL: ${{ secrets.BETA_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$BETA_DEPLOY_WEBHOOK_URL" ]; then
            echo "❌ BETA_DEPLOY_WEBHOOK_URL secret is not configured in GitHub Repository Secrets."
            exit 1
          fi
          echo "Triggering Beta deployment via Deploy Webhook..."
          curl -f -s -X POST "$BETA_DEPLOY_WEBHOOK_URL"

      - name: Wait for Beta Rolling Deployment & Health Check
        env:
          BETA_API_URL: ${{ secrets.BETA_API_URL || 'https://api-beta.nabin.in' }}
        run: |
          echo "Probing beta cluster health & readiness..."
          HEALTHY=false
          for i in {1..15}; do
            HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BETA_API_URL/api/health")
            READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BETA_API_URL/api/ready")
            if [ "$HEALTH_CODE" = "200" ] && [ "$READY_CODE" = "200" ]; then
              echo "✅ Beta deployment healthy: /api/health (200), /api/ready (200)"
              HEALTHY=true
              break
            fi
            echo "Waiting for beta deployment (Attempt $i/15: health=$HEALTH_CODE, ready=$READY_CODE)..."
            sleep 6
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Beta health checks failed after 90 seconds."
            exit 1
          fi

      - name: Run Beta Smoke Tests
        env:
          BETA_API_URL: ${{ secrets.BETA_API_URL || 'https://api-beta.nabin.in' }}
        run: |
          API_URL="$BETA_API_URL" node backend/smoke_test.js

  # =========================================================================
  # 5. PRODUCTION ZERO-DOWNTIME ROLLING DEPLOYMENT
  # =========================================================================
  deploy-production:
    name: Zero-Downtime Production Rolling Deployment
    needs: [ build-container ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Production Deployment Webhook
        env:
          PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$PROD_DEPLOY_WEBHOOK_URL" ]; then
            echo "❌ PROD_DEPLOY_WEBHOOK_URL secret is not configured in GitHub Repository Secrets."
            exit 1
          fi
          echo "Triggering Production deployment via Deploy Webhook..."
          curl -f -s -X POST "$PROD_DEPLOY_WEBHOOK_URL"

      - name: Verify Production Health & Database Readiness
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL || 'https://api.nabin.in' }}
          PROD_ROLLBACK_WEBHOOK_URL: ${{ secrets.PROD_ROLLBACK_WEBHOOK_URL }}
          PREV_SHA: ${{ github.event.before }}
        run: |
          echo "Probing production cluster health & readiness..."
          HEALTHY=false
          for i in {1..15}; do
            HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_API_URL/api/health")
            READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_API_URL/api/ready")
            if [ "$HEALTH_CODE" = "200" ] && [ "$READY_CODE" = "200" ]; then
              echo "✅ Production deployment healthy: /api/health (200), /api/ready (200)"
              HEALTHY=true
              break
            fi
            echo "Waiting for production rolling update (Attempt $i/15: health=$HEALTH_CODE, ready=$READY_CODE)..."
            sleep 6
          done
          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Production health check failed! Triggering automatic rollback..."
            if [ -n "$PROD_ROLLBACK_WEBHOOK_URL" ]; then
              curl -f -X POST "$PROD_ROLLBACK_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "{\"action\":\"rollback\",\"environment\":\"production\",\"failedSha\":\"${{ github.sha }}\",\"previousSha\":\"$PREV_SHA\"}"
            fi
            exit 1
          fi

      - name: Run Production Smoke Verification
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL || 'https://api.nabin.in' }}
          PROD_ROLLBACK_WEBHOOK_URL: ${{ secrets.PROD_ROLLBACK_WEBHOOK_URL }}
          PREV_SHA: ${{ github.event.before }}
        run: |
          echo "Executing production smoke tests..."
          if ! API_URL="$PROD_API_URL" node backend/smoke_test.js; then
            echo "❌ Production smoke tests failed! Triggering automatic rollback..."
            if [ -n "$PROD_ROLLBACK_WEBHOOK_URL" ]; then
              curl -f -X POST "$PROD_ROLLBACK_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "{\"action\":\"rollback\",\"environment\":\"production\",\"failedSha\":\"${{ github.sha }}\",\"previousSha\":\"$PREV_SHA\"}"
            fi
            exit 1
          fi
          echo "✅ Production deployment and smoke verification complete."
